<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rueda de Casino — Call Simulator (MVP)</title>
<style>
  :root{
    --bg:#0f1220; --panel:#181c2e; --panel2:#20263f; --line:#2c3352;
    --ink:#e8ebf7; --muted:#9aa3c4; --accent:#5b8cff;
    --lead:#ff7a59; --follow:#3fc6a0; --stage:#12162a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);
       height:100dvh;overflow:hidden;display:flex;flex-direction:column}
  header{padding:10px 20px;border-bottom:1px solid var(--line);flex:0 0 auto}
  header h1{margin:0;font-size:17px;font-weight:650;letter-spacing:.2px}
  header p{margin:3px 0 0;color:var(--muted);font-size:12px}
  /* Full-viewport layout: stage flexes to fill; the Calls panel is always pinned/visible.
     Landscape → Calls on the right; Portrait → Calls at the bottom. The page never scrolls. */
  #app{flex:1 1 auto;min-height:0;display:flex}
  .stagewrap{flex:1 1 auto;min-width:0;min-height:0;padding:12px 14px;
             display:flex;flex-direction:column;gap:8px;overflow:hidden}
  .stage{flex:1 1 auto;min-height:0;background:var(--stage);border:1px solid var(--line);
         border-radius:14px;overflow:hidden;position:relative}
  svg{display:block;width:100%;height:100%}
  /* Wider than it was (340px): the panel is now the only home for both lists, and the animation can
     afford the room — Sam: "give the panel more horizontal room, the animation may shrink to pay for it." */
  .side{flex:0 0 420px;border-left:1px solid var(--line);background:var(--panel);
        display:flex;flex-direction:column;min-height:0}
  .tabrow{display:flex;align-items:center;gap:6px;margin-bottom:10px}
  .tab{background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 12px;
       font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
  .tab:hover{color:var(--ink)}
  .tab.active{background:var(--chip);border-color:var(--line);color:var(--ink)}
  .movehint{font-size:11.5px}
  .calls-pin{flex:0 0 auto;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  .side-scroll{flex:1 1 auto;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
  @media (orientation:portrait){
    #app{flex-direction:column}
    .side{flex:0 0 auto;max-height:42vh;border-left:none;border-top:1px solid var(--line)}
    .calls-pin{border-bottom:1px solid var(--line)}
    /* Trim vertical chrome so the wheel keeps as much height as possible. */
    header p{display:none}
    header{padding:8px 16px}
    .stagewrap{padding:8px 10px;gap:6px}
    .toolbar{gap:6px}
    .toolbar label.ctl,.toolbar button,.toolbar select{font-size:12px}
    .toolbar button{padding:6px 10px}
    .modebar{margin:2px 0}
  }
  /* Short landscape screens (e.g. phone held sideways): trim vertical chrome so everything still fits. */
  @media (orientation:landscape) and (max-height:560px){
    header p{display:none}
    header{padding:8px 16px}
    .stagewrap{padding:8px 10px;gap:6px}
    .toolbar button{padding:6px 10px}
    .side{flex-basis:340px}
  }
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .calls{display:flex;flex-wrap:wrap;gap:8px}
  /* Buttons live in a fixed GRID, not a wrapping flex row: a hover or a state change can alter a
     button's ink but never its cell, so nothing reflows and a button can't slide out from under the
     pointer mid-click (which used to deselect a call as you tried to pick it). */
  .btngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:5px}
  .btngrid button{width:100%;padding:6px 6px;font-size:11.5px;text-align:center;
                  white-space:normal;line-height:1.15;min-height:32px;display:flex;
                  align-items:center;justify-content:center}
  .grouped{display:flex;flex-direction:column;gap:10px}
  /* `display:flex` above is an AUTHOR rule, and the `hidden` attribute is only styled by the UA
     stylesheet — author beats UA regardless of specificity, so setting `.hidden` on a `.grouped`
     did nothing and both tabs rendered at once. The inactive list has to be turned off explicitly. */
  .grouped[hidden]{display:none}
  .grp-title{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);
             margin:0 0 4px;font-weight:600}
  .grp.empty{display:none}
  .secctl{display:flex;gap:10px;align-items:center;font-weight:400;text-transform:none;letter-spacing:0}
  .secctl label.ctl{font-size:11px;gap:4px}
  .secctl input{margin:0}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
         padding:9px 14px;border-radius:10px;transition:transform .05s, border-color .15s, background .15s}
  button:hover{border-color:var(--accent)}
  button:active{transform:translateY(1px)}
  button.call{background:#232a45}
  button.primary{background:var(--accent);border-color:var(--accent);color:#0b1020;font-weight:600}
  button.ghost{background:transparent}
  button:disabled{opacity:.32;cursor:not-allowed;border-color:var(--line)}
  button:disabled:hover{border-color:var(--line)}
  .posbar{font-size:13px;color:var(--muted);margin-top:2px}
  .posname{color:var(--ink);font-weight:600}
  select{font:inherit;background:var(--panel2);color:var(--ink);border:1px solid var(--line);
         padding:8px 10px;border-radius:10px}
  label.ctl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .card h2{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
  .legend{display:flex;gap:16px;font-size:13px}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
  #log{max-height:120px;overflow:auto;font-size:13px;line-height:1.6}
  #log .step{color:var(--muted)}
  #log .move{color:var(--ink);font-weight:600}
  #log .note{color:var(--muted);font-style:italic}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600}
  .pill{font-size:11px;padding:1px 7px;border-radius:20px}
  .pill.L{background:rgba(255,122,89,.18);color:var(--lead)}
  .pill.F{background:rgba(63,198,160,.18);color:var(--follow)}
  .muted{color:var(--muted);font-size:12px;line-height:1.5}
  .modebar{display:flex;align-items:center;gap:8px;margin:6px 0 2px}
  .modebar .modelabel{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.7px}
  .modebtn{padding:6px 12px;border-radius:8px;background:var(--panel2);font-size:13px}
  .modebtn.active{background:var(--accent);color:#0b1020;border-color:var(--accent);font-weight:600}
  .section{margin-top:12px}
  .sectitle{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0 0 7px;display:flex;align-items:center;gap:8px}
  .sectitle .hint{text-transform:none;letter-spacing:0;font-size:11px;opacity:.75}
  .decision{margin:12px 0;padding:10px 12px;border:1px solid var(--accent);border-radius:10px;
            background:rgba(91,140,255,.08);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .decision .dtext{font-size:13px;color:var(--ink)}
  button.silence{background:#2a3150}
  .beatbig{position:absolute;top:6px;right:18px;font-size:72px;line-height:1;font-weight:800;
           color:var(--accent);opacity:.92;font-variant-numeric:tabular-nums;pointer-events:none;
           text-shadow:0 2px 14px rgba(0,0,0,.55)}
  /* The corner stack: now-playing, a gap, the queue. `min-height` on the now-playing line keeps the
     queue from jumping up and down as calls start and stop — the queue is a list you read, and a list
     that moves when nothing about it changed is a list you stop trusting. */
  .corner{position:absolute;top:12px;left:18px;pointer-events:none;max-width:60%}
  .nowplaying{font-size:15px;font-weight:600;color:var(--ink);min-height:20px;
              text-shadow:0 2px 12px rgba(0,0,0,.55)}
  .nowplaying .np-call{color:var(--accent)}
  .nowplaying .np-move{color:var(--ink)}
  /* 22px of nothing. Not a border, not a rule — the queue is the same kind of thing as the line above it
     and a divider would imply otherwise; it is simply not happening yet, and distance says that. */
  .queuelist{margin-top:22px;text-shadow:0 2px 12px rgba(0,0,0,.55)}
  .queuelist .qhead{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
                    margin-bottom:4px;font-weight:600}
  .queuelist .qcall{font-size:13.5px;line-height:1.65;color:var(--ink);opacity:.72}
  .queuelist .qcall .qnum{color:var(--muted);font-size:12px;margin-right:4px}
  /* The next call up is the one about to be danced — it reads brighter than the ones behind it. */
  .queuelist .qcall.qnext{opacity:1;font-weight:600}
  .beatstrip{display:flex;justify-content:center;margin-top:2px}
  .beatpips{display:flex;gap:8px}
  .beatpips span{width:30px;height:9px;border-radius:5px;background:var(--line);transition:background .06s}
  .beatpips span.on{background:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>Rueda de Casino — Call Simulator <span style="color:var(--muted);font-weight:400">· MVP</span></h1>
  <p>Step through calls and watch the formation change. Model is a first draft — meant to be corrected against the real dance.</p>
</header>

<div id="app">
  <main class="stagewrap">
    <div class="toolbar">
      <label class="ctl">Couples
        <select id="couples">
          <option>4</option><option>6</option><option>8</option>
        </select>
      </label>
      <label class="ctl">Formation
        <select id="layout">
          <option value="circle">Rueda (circle)</option>
          <option value="linea">Línea Moderna</option>
        </select>
      </label>
      <label class="ctl">Speed
        <input type="range" id="speed" min="0" max="1" step="0.01" value="0.5" style="width:120px;vertical-align:middle">
        <span id="speedval" class="muted">1.0×</span>
      </label>
      <button id="beatToggle" class="ghost">⏸ Stop beat</button>
      <button id="reset" class="ghost">Reset to base</button>
      <button id="undo" class="ghost">← Undo</button>
    </div>

    <div class="stage">
      <svg id="stage" viewBox="85 5 510 510" preserveAspectRatio="xMidYMid meet"></svg>
      <!-- Top-left corner: what is happening NOW, then a deliberate gap, then what is coming. The gap is
           the whole point — it is what tells a dancer at a glance which line is the call being danced and
           which lines are merely promised. -->
      <div class="corner">
        <div id="nowplaying" class="nowplaying"></div>
        <div id="queueList" class="queuelist"></div>
      </div>
      <div id="beatbig" class="beatbig">1</div>
    </div>

    <div class="beatstrip"><div id="beatpips" class="beatpips"></div></div>
    <div class="posbar">Formation: <span id="posname" class="posname">Casino position</span></div>

    <div class="modebar">
      <span class="modelabel">Mode</span>
      <button id="modeLive" class="modebtn">Live · queue calls</button>
      <button id="modeStep" class="modebtn">Step · pause for calls</button>
    </div>

    <div id="decision" class="decision" style="display:none">
      <span class="dtext" id="decisionText"></span>
      <button id="silenceBtn" class="silence">Silence</button>
    </div>
  </main>

  <aside class="side">
    <!-- One panel, two tabs. Calls and Movements are the same kind of thing to a user — a list of things
         you can fire — so they share a space rather than competing for one, and the tabs replace the two
         `show` checkboxes that used to do the same job less clearly. -->
    <div class="calls-pin">
      <div class="tabrow" role="tablist">
        <button class="tab active" id="tabCalls" role="tab" aria-selected="true">Calls</button>
        <button class="tab" id="tabMoves" role="tab" aria-selected="false">Movements</button>
        <label class="ctl" style="margin-left:auto"><input type="checkbox" id="hideUnavail"> Hide Unavailable</label>
      </div>
      <div class="grouped" id="callButtons"></div>
      <div class="grouped" id="moveButtons" hidden></div>
      <p class="muted movehint" id="moveHint" hidden style="margin:8px 0 0">Fire one at a time to test — a movement runs to completion and can't be interrupted.</p>
    </div>

    <div class="side-scroll">
      <div class="card" style="margin-top:0">
        <h2>Call log</h2>
        <div id="log"></div>
      </div>
    </div>
  </aside>
</div>

<script>
/* ------------------------------------------------------------------ *
 *  DATA MODEL
 *  A dancer = { id, role:'L'|'F', couple:int, station:int, ring:'in'|'out' }
 *  - station  : which slot around the wheel / along the line they occupy
 *  - ring     : leaders start 'in', followers 'out'; some moves swap this
 *  - couple   : identity tag (never changes) so you can track a person
 *  Invariant : every station holds exactly one 'L' and one 'F'. Those two
 *              are partners *right now*. Facing always points at the partner.
 *
 *  A CALL is a pure function (dancers, N) -> new dancers (or null = "no
 *  formation change, returns to base"). Add new calls by adding to CALLS.
 * ------------------------------------------------------------------ */

const MOVEMENTS = {
  dame: {
    label: 'Dame',
    desc: 'Progresses the leader one couple, ending in Exhibela facing the new partner. Leader and follower now travel toward each other and meet at the spoke midway between their two old couples — so the wheel flips to the other of its two spoke configs and lands exactly on the grid (no drift). The follower progresses clockwise (anti-clockwise afuera) to the meeting spoke.',
    requires: ['casino', 'exhibela', 'dile'], sets: 'exhibela', progresses: 1, afueraReady: true, interrupt: true,
    // Odd from Casino and Exhibela (dh −1/+1), even from the Dile Que No position (−2/0, the follower
    // scripted): the flip is the arithmetic, not a flag that happens to travel with the name.
    flipsPhase: (from) => virtualPos(from) !== 'dile',
    anim: { duration: 700 },
    beats: (from) => virtualPos(from) === 'casino' ? 2 : 4,
    play: { byFrom: {
      default: { travel: 'dame', mirror: true },
      // From the Dile Que No position the leader walks straight to his new partner one couple
      // anti-clockwise while she dances her ¾ circle back to her own spot. This was the second half of
      // the `dile_dame` compound; it is a Dame, so it lives on the Dame.
      dile: { travel: 'dile_dame', mirror: true, opts: { steps: 32, settle: 0.28, beats: 4 },
        script: { F: { kind: 'three_quarter_circle' } },
        face: { L: 'partner', F: { from: 'travel', to: 'partnerEnd', after: 0.75, freeze: true } } },
    } }
  },
  dame_dos: {
    label: 'Dame Dos',
    desc: 'Like Dame but the leader progresses two couples — he passes one follower and joins the next while the follower steps half a couple to the between-spoke. Flips the phase (lands on the other config) and ends in Exhibela facing the new partner.',
    // NOT afuera. Holding the pass sides — which afuera does not change — sends the leaders round an
    // enormous arc, which is why it is almost never called that way on a floor. Sam: ban it rather than
    // draw it. The same reasoning retires its Línea forms below.
    requires: ['casino', 'exhibela', 'dile'], sets: 'exhibela', progresses: 2, interrupt: true,
    flipsPhase: (from) => virtualPos(from) !== 'dile',
    anim: { duration: 820 },
    beats: 4,
    play: { byFrom: {
      default: { travel: 'dame_dos', mirror: true },
      dile: { travel: 'dile_dame_dos', mirror: true, opts: { steps: 32, settle: 0.28, beats: 4 },
        script: { F: { kind: 'three_quarter_circle' } },
        face: { L: 'partner', F: { from: 'travel', to: 'partnerEnd', after: 0.75, freeze: true } } },
    } }
  },
  dame_pequena: {
    label: 'Dame Pequena',
    desc: 'Progresses the leader one couple WITHOUT changing the spoke config — the couples stay on the same midpoint spokes, only the pairing shifts. From Exhibela the follower stays put and the leader travels the whole way to the next follower (a Dame where the leader does all the work). From Casino the follower does a Reverse Adios across her own spoke (turning 180° anti-clockwise) while the leader travels the larger distance to the next follower’s spoke. Ends in Exhibela at the same spokes. Afuera it inverts inside-out (progression clockwise, lanes swapped), ending in Afuera Exhibela. (Meant for Rueda / Línea Moderna work; not yet used as a call.)',
    requires: ['casino', 'exhibela'], sets: 'exhibela', progresses: 1, afueraReady: true,
    anim: { duration: 820 },
    beats: 4,
    /* FROM THE DILE QUE NO POSITION SHE DANCES HER ¾ CIRCLE — the same figure the circle Dame already
     * does from there. Sam: "when doing a Dame move where the follower wants to end up back in the same
     * slot, she should do her 3/4 circle movement that we've already defined as part of Rueda formation …
     * The same should be true for Dame Pequeña in LM formation."
     *
     * And the leader passes her on the RIGHT, which is the Dile Que No position's own convention rather
     * than the rueda role default. Without that declaration the planner fell back to `'L,F': 'left'` and
     * drove him round the wrong side: measured, the INTENDED path already went right at 6.49px and the
     * evasion reversed it to 38px on the left. No fault was recorded, because it achieved exactly the
     * rule it had been given — the rule was the wrong one. */
    play: { byFrom: {
      // She dances a Reverse Adios across her own spoke from Casino, and simply stands still from
      // Exhibela — which is the same instruction, because from Exhibela that slot is where she already
      // is. Only the facing differs: coming from Casino she spins anti-clockwise onto her new leader.
      default: { travel: 'dame_pequena', mirror: true,
        script: { F: { kind: 'to_lane', bow: { side: 'right', amp: 'justMiss' } } },
        face: { F: { byVirtualPos: { exhibela: null,
          casino: { from: 'start', to: 'partnerEnd', dir: 'ccw', after: 0, ease: 'linear' } } } } },
      // The SAME definition the circle Dame uses from here — `dile_dame` already states both the leader's
      // one-couple crossing and the Dile Que No position's `partner0: 'right'`. Sharing it rather than
      // restating it is the point: these are one figure, and §46 was flagging the near-duplicate.
      dile: { travel: 'dile_dame', mirror: true, opts: { steps: 32, settle: 0.28, beats: 4 },
        script: { F: { kind: 'three_quarter_circle' } },
        face: { L: 'partner', F: { from: 'travel', to: 'partnerEnd', after: 0.75, freeze: true } } },
    } }
  },
  dame_dos_pequena: {
    label: 'Dame Dos Pequena',
    desc: 'Dame Pequeña progressing TWO couples instead of one: the leader does all the travelling and the follower dances the identical figure, so the spoke config is unchanged. On a mini 2-couple wheel two couples is the whole wheel — the leader crosses it twice, going by the other leader on each other’s right (left shoulder) both times, and lands back with his own partner in the slot he started in. Still 4 beats, so he covers twice the ground in the same time. Ends in Exhibela at the same spokes.',
    requires: ['casino', 'exhibela'], sets: 'exhibela', progresses: 2,   // not afuera — see Dame Dos
    anim: { duration: 820 },
    beats: 4,
    // Identical to Dame Pequeña but for the travel it names — which is the whole claim: the follower's
    // figure and facing are the same instruction in both, so she is the dancer who dances the same thing.
    play: { travel: 'dame_dos_pequena', mirror: true,
      script: { F: { kind: 'to_lane', bow: { side: 'right', amp: 'justMiss' } } },
      face: { F: { byVirtualPos: { exhibela: null,
        casino: { from: 'start', to: 'partnerEnd', dir: 'ccw', after: 0, ease: 'linear' } } } } }
  },
  linea_moderna: {
    label: 'Línea Moderna',
    desc: 'From Casino on the rueda: the wheel opens into the two-ring Rueda Línea Moderna. The cantante’s couple and every other couple clockwise (the primeros) walk in to the inner ring, each landing on the spoke one couple clockwise of where it started, turning ANTI-CLOCKWISE as a couple (a tight turn, always less than a full circle) into their new orientation; the couples between them (the segundos) walk straight out along their own spokes to the outer ring without turning, so the segundos’ spokes become the formation’s spokes and each primero ends in a mini 2-couple wheel with the segundo that was next clockwise. Everyone stays in Casino, partners facing each other throughout. Requires an even number of couples.',
    requires: ['casino'], sets: 'linea', needsEven: true, noAfuera: true, changesLayout: 'linea',
    beats: 8,
    play: { formation: 'linea', turn: 'ccw' }
  },
  dame_linea: {
    label: 'Dame Línea',
    desc: 'From Casino on the rueda: a Dame that lands the wheel in Rueda Línea Moderna. Each primero couple and the segundo couple one place clockwise of it exchange followers, and the two new couples take the two rings of the mini wheel they now share. The new spokes sit midway between each primero’s spoke and the segundo’s one couple clockwise — exactly where a Dame’s partners meet — so the segundo leaders dance an ordinary Dame onto them, easing out to the outer ring and gathering the primero followers there in Exhibela; those outer couples set the formation’s spokes. Meanwhile each primero leader and the segundo follower one couple clockwise walk straight in to the inner ring of that same spoke, meeting as its inner couple. Ends in the Línea exhibela state, ready for a Dile Que No Grande. Even couple counts only.',
    requires: ['casino'], sets: 'linea_ex', needsEven: true, noAfuera: true, changesLayout: 'linea',
    progresses: 1,
    // Two beats, like the Dame it is. It is a progressing Dame-type figure that closes into a Dile Que
    // No, so `startBeatOf` snaps it to beat 9 − 2 = 7: it ends on 8 and the Dile Que No Grande lands on
    // beat 1, giving the call the same 2 + 8 = 10 beats a plain Dame takes. It used to declare 4, which
    // started it on 5 and made the call 12 — the figure was musically a bar and a half long.
    beats: 2,
    play: { formation: 'linea_dame' }
  },
  rueda: {
    label: 'Rueda',
    desc: 'From Rueda Línea Moderna (Casino): the two rings fold back into a single rueda. The outer couples keep their exact midpoint spokes and simply walk straight in to the ring without turning — so the new rueda inherits the formation’s orientation. Each inner couple comes out to the place one clockwise of where its own mini-wheel partner lands, travelling as a couple and turning ANTI-CLOCKWISE until it matches its new spot. Everyone stays in Casino, partners facing each other throughout.',
    requires: ['linea'], sets: 'casino', changesLayout: 'circle',
    beats: 8,
    play: { formation: 'circle', turn: 'ccw' }
  },
  adios_rueda: {
    label: 'Adios Rueda',
    desc: 'The same exit from Rueda Línea Moderna as Rueda — outer couples walk straight in on their own spokes, inner couples come out one place clockwise of them — except the inner couples sweep CLOCKWISE the long way round into their new orientation instead of taking the tight anti-clockwise turn.',
    requires: ['linea'], sets: 'casino', changesLayout: 'circle',
    beats: 8,
    play: { formation: 'circle', turn: 'cw' }
  },
  /* DAME EÑE — the first figure in which a dancer LEAVES HIS MINI-WHEEL.
   *
   * Sam: "3 of the dancers in each mini wheel (both inner dancers and the outer follower) do exactly what
   * they would do from that same position if they were doing a Dame Pequeña movement. The only dancer
   * whose movement differs is the outside leader … If they start in LM Casino position, they change slots
   * into the inner couple slot of the mini wheel one wheel anti-clockwise from their starting mini wheel.
   * If they start in LM Exhibela position, they change slots into the inner couple slot of the mini wheel
   * one wheel clockwise of their starting wheel."
   *
   * NOT COMPOSED, and that is the point of it. `compose: 'pequena'` runs a figure inside each mini-wheel's

/* ------------------------------------------------------------------ *
 *  Línea Moderna movements, generated from the circle movements.
 *  A GRANDE variant runs the circle figure on both rings (outer normal,
 *  inner afuera) via grandeFrames — same phase behaviour as the circle
 *  figure. A PEQUEÑA variant runs it in the mini 2-couple wheels via
 *  pequenaFrames, with every Dame → Dame Pequeña and no phase change.
 *  Circle position ↔ Línea state: casino↔linea, exhibela↔linea_ex (grande)
 *  (both rings exhibela). grandeFrames/pequenaFrames are hoisted below.
 * ------------------------------------------------------------------ */
(function buildLineaMovements(){
  /* A composition can only carry over the positions it knows how to translate. A position the map leaves
   * alone is one this composition has no Línea counterpart for, and is dropped rather than silently
   * handed a position it cannot resolve.
   *
   * The GRANDE map used to stop at casino and exhibela, because there was no Línea Moderna Dile Que No
   * entry in `LINEA_SUB` for it. There is now, so `dile` maps too — and that is what makes a Dame Grande
   * danceable FROM the LM Dile Que No position, which is what a Dame called over a pending Dile Que No
   * needs. Sam found it the other way round: the call skipped the Dile Que No and danced a Dame Grande
   * from Exhibela, because a Dame Grande from the Dile Que No position did not exist to be danced. */
  const gMap = v => v === 'casino' ? 'linea' : v === 'exhibela' ? 'linea_ex' : v === 'dile' ? 'linea_dile' : v;
  const gUn  = l => l === 'linea' ? 'casino' : l === 'linea_dile' ? 'dile' : 'exhibela';
  const pMap = v => v === 'casino' ? 'linea' : v === 'exhibela' ? 'linea_ex' : v === 'dile' ? 'linea_dile' : v;
  const pUn  = l => l === 'linea' ? 'casino' : l === 'linea_dile' ? 'dile' : 'exhibela';
  const mapSets = (sets, map, un) => (typeof sets === 'function') ? (from) => map(sets(un(from))) : map(sets);
  const mapBeats = (beats, un) => (typeof beats === 'function') ? (from) => beats(un(from)) : beats;
  // circle keys that get Línea versions (the figures used by the ported calls)
  /* A MOVEMENT KEEPS ITS NAME ACROSS FORMATIONS. Sam: "different formations like Afuera already reuse
   * just 'Enchufla' for the movement, and some movements like 'Dame' have completely different pathing
   * depending on if they are called from Casino position or Exhibela position, so it seems perfectly
   * natural to allow this movement within Línea Moderna to be shared with the movement in Rueda
   * formation, especially as they should be absolutely identical."
   *
   * So a figure in which NOBODY CHANGES SLOT gains the Línea positions on the movement it already is,
   * rather than being minted twice more under decorated names. Measured across 4/6/8 couples, the grande
   * and pequeña forms of every one of these was byte-identical to the other — 0.000px — because a figure
   * danced inside a couple does not care which wheel the couple is standing on. Grande and Pequeña are
   * markers for WHICH SLOT TO PROGRESS TO, and these progress nobody.
   *
   * The Dame family keeps its two forms, because there the marker is the whole point: from LM Casino a
   * Dame Grande and a Dame Pequeña are both callable and land the dancers somewhere different. */
  /* `exhibela` is in this list so that CON EXHIBELA CAN DIVERT IN LÍNEA. The divert sets the queue to
   * the Exhibela movement, and that movement only accepted the circle Exhibela position — so from LM
   * Exhibela `nextMovement` dropped it as invalid and the divert silently did nothing. It is danced
   * inside the couple and changes nobody's slot, so it belongs here with the rest of the in-place
   * family and needs no second name. */
  const IN_PLACE = ['enchufla', 'vacilala', 'adios', 'leaders_enchufla', 'exhibela', 'dile', 'dile4'];
  const PROGRESSING = ['dame'];
  for (const key of IN_PLACE){
    const m = MOVEMENTS[key];
    const circlePlay = m.play, circleSets = m.sets, circleBeats = m.beats;
    const lineaFrom = m.requires.filter(v => pMap(v) !== v).map(pMap);
    m.requires = m.requires.concat(lineaFrom);
    m.linea = true;   // `interrupt` rides along on the movement itself: same figure, same junctures
    /* THE 4-BEAT DILE QUE NO IS NOT GATED IN LÍNEA, and the gate that used to be here is why Sam found it
     * missing. It carried `minCouples: 6` against a measurement of "29.6px apart at four couples", taken
     * before the via-point pathing landed. Re-measured on the current engine: the closest any two dancers
     * come during the figure is **36.42px at four couples — identical to six and eight** — against a 34px
     * floor, landing 46px apart. The wheel it is danced on does not change the step; only the endpoints
     * moved, and they moved far enough. A stale number was hiding a working figure, so it is gone rather
     * than adjusted: there is nothing left for it to protect. */
    // From a Línea position, resolve the underlying circle answer and map it back into Línea's names.
    m.sets = (from) => {
      if (!LINEA_SUB_PEQ[from]) return (typeof circleSets === 'function') ? circleSets(from) : circleSets;
      const c = pUn(from);
      return pMap((typeof circleSets === 'function') ? circleSets(c) : circleSets);
    };
    m.beats = (from) => {
      const c = LINEA_SUB_PEQ[from] ? pUn(from) : from;
      return (typeof circleBeats === 'function') ? circleBeats(c) : (circleBeats === undefined ? 4 : circleBeats);
    };
    const byFrom = { default: circlePlay };
    // Derived from the map itself rather than read off LINEA_SUB_PEQ, which is declared further down.
    ['casino', 'exhibela', 'dile'].forEach(c => { byFrom[pMap(c)] = { compose: 'pequena', of: key }; });
    m.play = { byFrom };
  }
  const KEYS = PROGRESSING;
  for (const key of KEYS){
    const m = MOVEMENTS[key];
    /* A Dame Dos progresses TWO couples, and each Linea ring holds only half the wheel. On a ring of two
     * that is the whole ring — the same discovery as Dame Dos Pequena, one level up — and on a ring of
     * three it is a near-antipodal swap that the ring has no room for: measured, leaders close to 3.1px
     * at 4 couples and 15.8px at 6, against a 34px floor, with the collisions unresolvable by any side.
     * So the grande form needs four couples per ring, i.e. eight in the wheel. Sam's call, and it is a
     * geometric limit rather than a preference: the figure does not fit. */
    const grandeMin = (key === 'dame_dos') ? 8 : m.minCouples;
    MOVEMENTS[key + '_grande'] = {
      label: m.label + ' Grande', linea: true, minCouples: grandeMin, interrupt: m.interrupt,
      requires: m.requires.filter(v => gMap(v) !== v).map(gMap), sets: mapSets(m.sets, gMap, gUn),
      progresses: m.progresses, flipsPhase: m.flipsPhase,
      beats: mapBeats(m.beats, gUn), anim: m.anim,
      play: { compose: 'grande', of: key },
    };
    // Pequeña: a Dame becomes a Dame Pequeña — the leader does all the travelling, so no phase flip.
    // The COUNT is preserved: a Dame Dos is a two-couple progression on whatever wheel it is danced on,
    // and mapping it to the one-couple figure is what used to throw that away (both keys produced
    // byte-identical frames, a two-couple label over a one-couple figure — §39 asserts against it now).
    const pKey = key === 'dame' ? 'dame_pequena' : key === 'dame_dos' ? 'dame_dos_pequena' : key;
    const pm = MOVEMENTS[pKey];
    MOVEMENTS[key + '_peq'] = {
      label: m.label + ' Pequeña', linea: true, interrupt: m.interrupt,
      requires: m.requires.filter(v => pMap(v) !== v).map(pMap), sets: mapSets(m.sets, pMap, pUn),
      progresses: m.progresses,                                   // never flips phase
      beats: mapBeats(pm.beats, pUn), anim: pm.anim,
      play: { compose: 'pequena', of: pKey },
    };
  }
  /* MUJERES ARRIBA HAS ONE FORM IN LÍNEA, AND THE OTHER TURNED OUT TO BE A DAME.
   *
   * Pequeña is a real, distinct figure: the woman crosses her mini 2-couple wheel alone, which swaps her
   * between the rings, while the men stay put. Grande is not. Worked out properly — the pairing advancing
   * one couple around each ring, with both partners sharing the crossing so it fits on a ring of two — it
   * lands every dancer in exactly the slots a DAME lands them in, on the same flipped phase. Sam:
   * "Mujeres Arriba Grande IS the same movement as Dame Grande from Dile Que No position."
   *
   * Which is what the code said before any of this was built: *"a grande Mujeres Arriba would just be a
   * Dile Que No y Dame, so it has no grande form."* That comment was right, and it was deleted to make
   * room for a form that then took four attempts to derive back to the thing it had described. */
  for (const key of ['mujeres']){
    const m = MOVEMENTS[key];
    MOVEMENTS[key + '_peq'] = {
      label: m.label + ' Pequeña', linea: true,
      requires: m.requires.map(pMap), sets: mapSets(m.sets, pMap, pUn),
      progresses: m.progresses,
      beats: mapBeats(m.beats, pUn), anim: m.anim,
      /* No gate. It carried a `minCouples: 6` from a pre-via-point measurement; re-measured, the closest
       * approach is 33.15px at four, six AND eight couples — the identical number, because a mini
       * 2-couple wheel is the same size whatever the rueda around it is doing. A figure whose clearance
       * does not vary with N cannot have a floor in N. */
      play: { compose: 'pequena', of: key },
    };
  }
  /* THE DAME GRANDE IS TWO FIGURES UNDER ONE NAME, chosen by where it is danced from. From LM Casino or
   * LM Exhibela it composes the ordinary Dame. From the LM Dile Que No position it composes the SHARED
   * Dame — because the circle Dame from there is the one-dancer-does-everything version that the Dile Que
   * No y Dame compound wants, and on a Línea ring that version does not fit: the leader crossing a whole
   * couple while his partner is scripted in place is the shape that could not be pathed. */
  MOVEMENTS.dame_grande.play = { byFrom: {
    default:    { compose: 'grande', of: 'dame' },
    linea_dile: { compose: 'grande', of: 'dame_shared' },
  } };
})();

/* ------------------------------------------------------------------ *
 *  CALLS — a call is a word the caller shouts; it expands into a
 *  sequence of MOVEMENTS (which movements can depend on the starting
 *  position). After a call's movements finish, if the dancers are in a
 *  transient Exhibela with nothing else queued, they default to a Dile
 *  Que No back to Casino.
 * ------------------------------------------------------------------ */
const CALLS = {
  dame:     { label: 'Dame',     desc: 'Call from Casino: the Dame movement, then (by default) a Dile Que No back to Casino — the leader progresses one couple. Called when a Dile Que No is already the next movement, it merges into a Dile Que No y Dame.', from: ['casino', 'afuera'], seq: ['dame'] },
  // Not from afuera: the movement is banned there (holding the pass sides, which afuera does not change,
  // sends the leaders round an enormous arc), so the call cannot be either. §40 keeps the two in step.
  dame_dos: { label: 'Dame Dos', desc: 'Call: like Dame but the leader progresses two couples. Called when a Dile Que No is already the next movement, it merges into a Dile Que No y Dame Dos.', from: ['casino'], seq: ['dame_dos'] },

/* ---- layouts: (station, lane, N) -> {x,y} in SVG space ----
 * lane describes where within a station a dancer stands:
 *   'ccw' / 'cw'    -> the two sides on the dotted ring (base formation)
 *   'inner'/'outer' -> radial arrangement after a Dame (inner = toward centre) */
const W = 720, H = 520;
let CX = 340, CY = 260;           // wheel centre — mutable so a sub-wheel context can relocate it (Línea Moderna)
let R_RING = 154;                 // wheel radius — recomputed for each couple count
let BASE_ANG = -90;               // angle of station 0's spoke (−90 = straight up); a wheel context can rotate it
// Fixed spacing from the 6-couple baseline: the within-couple distance and the
// between-couple gap stay constant, and the wheel grows/shrinks to fit N couples.
const W_DIST   = 2 * 154 * Math.sin(12 * Math.PI / 180);   // leader <-> follower centre distance (~64px)
const GAP_DIST = 2 * 154 * Math.sin(18 * Math.PI / 180);   // follower <-> next leader gap (~95px)
let DELTA_DEG = 12;               // half the within-couple angle at the current radius
// Sizing the wheel to the couple count is the circle formation's job (FORMATIONS.circle.compute).
// Always the circle solve for now; layout-dispatched sizing arrives when Línea becomes a real formation.
function computeWheel(n){ FORMATIONS[layoutName].compute(n); }
// Pure wheel-radius solve: the R for which n couples (each W_DIST wide) plus n gaps (GAP_DIST) wrap
// the circle exactly. No side effects (unlike circle.compute, which also sets the globals).
function solveWheelR(n){
  let lo = 20, hi = 3000;
  for (let i = 0; i < 60; i++){
    const R = (lo + hi) / 2;
    const total = n * (2 * Math.asin(Math.min(1, W_DIST / (2 * R))) + 2 * Math.asin(Math.min(1, GAP_DIST / (2 * R))));
    if (total > 2 * Math.PI) lo = R; else hi = R;
  }
  return (lo + hi) / 2;
}
const ARROW_TRANS = 'transform .5s cubic-bezier(.4,0,.2,1)';
const G_TRANS = 'transform .5s cubic-bezier(.4,0,.2,1)';
const DOT_R = 16;                 // dancer dot radius = half a shoulder (32px ≈ 46cm) vs W_DIST 64px ≈ 3ft: true-to-life 2:1
// The facing arrow, measured from the dancer's centre — so it emerges at the dancer's edge and reaches
// ARROW_LEN out.
const ARROW_LEN = 30;
// Dile Que No position: how far each partner steps along the couple's midpoint spoke, either side of the
// ring. They stand right next to each other there, spaced so the leader's facing arrow exactly bridges
// the gap — it leaves his edge and its tip meets hers, an equal (zero) gap at each end. That means the
// centres sit ARROW_LEN + DOT_R = 46px apart, half of it either side of the ring. It scales with the
// dancer and the arrow, and it is the SINGLE definition of that spacing: the circle and Línea slots and
// the Dile Que No y Dame compound all read it, so the position is identical however you arrive at it.
const R_STEP = (ARROW_LEN + DOT_R) / 2;
// The couple-midpoint radius: where a Casino/Exhibela couple's midpoint sits, slightly INSIDE the ring
// line (the two partners stand ±δ round the ring, so their chord's midpoint is R·cos δ). The Dile Que No
// position is built on this, NOT on the ring, so a couple that gathers onto its spoke keeps the midpoint
// of the slot it is standing in — which is what makes "did the couple midpoint move?" an exact test for
// scripted-vs-dynamic rather than one needing a fudge factor. A function, not a constant: R_RING and
// DELTA_DEG change with the couple count and with the sub-wheel context.
const R_MID = () => R_RING * Math.cos(DELTA_DEG * Math.PI / 180);
/* A Formation owns the geometry of one layout: where each (station, lane) slot sits, how the wheel
 * sizes to the couple count, and the faint guide drawn behind the dancers. Movements and rendering
 * reach geometry through here rather than hard-coding a layout.
 * (Refactor Phase 2: the seam is established. The shared globals CX/CY/R_RING/DELTA_DEG/phase are
 * still module-level and read directly by the generators; folding those in comes in later phases.) */

const FORMATIONS = {
  circle: {
    // Slot: where (station, lane) sits. The wheel rests in one of two configs: phase 0 (base) or
    // phase 1, whose midpoint spokes sit halfway between phase-0 spokes (offset 180/N degrees).
    slot(station, lane, N, ph){
      const theta = BASE_ANG + station * 360 / N + (ph === undefined ? phase : ph) * 180 / N;
      const delta = DELTA_DEG;
      let r = R_RING, a = theta;
      if (lane === 'cw')        a = theta + delta;                    // clockwise side of the ring
      else if (lane === 'ccw')  a = theta - delta;                    // anti-clockwise side of the ring
      else if (lane === 'pickup') a = theta + delta + (360 / N) * 0.15; // just clockwise of the cw follower
      else if (lane === 'inner') r = R_MID() - R_STEP;                // a step in along the couple's own spoke
      else if (lane === 'outer') r = R_MID() + R_STEP;                // a step out along it
      a = a * Math.PI / 180;
      return { x: CX + r * Math.cos(a), y: CY + r * Math.sin(a) };
    },
    // Size the wheel to N couples: solve n·(2·asin(W/2R)+2·asin(G/2R))=2π for R (the spacing wraps once).
    compute(n){
      R_RING = solveWheelR(n);
      DELTA_DEG = Math.asin(W_DIST / (2 * R_RING)) * 180 / Math.PI;
    },
    // Faint dashed ring behind the dancers.
    guide(svg){
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', CX); c.setAttribute('cy', CY); c.setAttribute('r', R_RING);
      c.setAttribute('fill', 'none'); c.setAttribute('stroke', '#2c3352'); c.setAttribute('stroke-dasharray', '4 6');
      svg.appendChild(c);
    },
  },
  // Rueda Línea Moderna: two concentric rings sharing m = N/2 spokes. Inner ring (afuera Casino) is a
  // proper m-couple rueda; each outer couple sits on the same spoke, one exact 2-couple-wheel out, so
  // every inner+outer pair forms a perfect little 2-couple "pequeña" wheel. Stations 0..m-1 are the
  // inner couples (by spoke); stations m..2m-1 are the outer couples (same spokes). Couple ids: inner
  // even (shown 1,3,5…), outer odd (shown 2,4,6…). See LM (geometry) below.
  linea: {
    slot(station, lane, N, ph){
      const g = LM, m = g.m;
      const inner = station < m, spoke = inner ? station : station - m;
      const p = (ph === undefined ? phase : ph);
      const th = (LM_BASE + spoke * 360 / m + p * 180 / m) * Math.PI / 180;   // two configs, like the circle
      // Dile Que No lanes are defined against the couple's OWN mini 2-couple wheel: both partners stand
      // on that wheel's midpoint spoke — which runs along the main spoke — the leader a step further OUT
      // from the mini centre and the follower a step IN. The inner ring's mini-radius points back toward
      // the main centre, so for it 'outer' is further in.
      if (lane === 'outer' || lane === 'inner'){
        const sgn = inner ? -1 : 1;
        const rr = g.mcR + sgn * (g.mid2 + (lane === 'outer' ? R_STEP : -R_STEP));
        return { x: CX + rr * Math.cos(th), y: CY + rr * Math.sin(th) };
      }
      const R = inner ? g.Ri : g.Ro, d = inner ? g.di : g.doO;
      const a = th + (lane === 'cw' ? d : lane === 'ccw' ? -d : 0);
      return { x: CX + R * Math.cos(a), y: CY + R * Math.sin(a) };
    },
    compute(n){
      const m = n / 2, W = W_DIST;
      const R2x = solveWheelR(2), d2x = Math.asin(W / (2 * R2x));    // textbook 2-couple wheel (reference)
      const Ri = solveWheelR(m), di = Math.asin(W / (2 * Ri));       // inner ring = proper m-couple rueda
      const innerMid = Ri * Math.cos(di);                           // inner couple midpoint radius
      // Ring separation. LM_GAP = 1 → each inner+outer pair is a *textbook* 2-couple wheel (couples are
      // GAP_DIST apart); LM_GAP < 1 pulls the outer ring in, making the mini-wheels a bit smaller and the
      // outer couples angularly wider (which is what lets the grande Dame-from-exhibela clear). The four
      // dancers of a pair are always a rectangle (each W/2 off the spoke), so the mini-wheel stays a
      // perfect circle at any separation.
      const sep = LM_GAP * 2 * R2x * Math.cos(d2x);
      const outerMid = innerMid + sep, mcR = innerMid + sep / 2;
      const R2 = Math.hypot(sep / 2, W / 2), d2 = Math.asin(W / (2 * R2));   // actual mini-wheel
      const Ro = Math.hypot(outerMid, W / 2), doO = Math.asin((W / 2) / Ro); // outer ring
      // mid2 = a mini-wheel couple's midpoint radius from its mini centre (= sep/2, since R2 is the
      // hypotenuse of sep/2 and W/2). The Dile Que No lanes step either side of THAT, not of R2, so the
      // position keeps its couple's midpoint — the circle formation's rule, applied to the mini wheel.
      LM = { m, R2, d2, mid2: sep / 2, Ri, di, mcR, Ro, doO };
      R_RING = Ro; DELTA_DEG = doO * 180 / Math.PI;                  // sane fallbacks for any circle-based code
    },
    // Mini-wheel centre for spoke k (radius mcR along the spoke, at the current phase) — used by the
    // guide and by pequeña composition.
    miniCenter(spoke, ph){ const p = (ph === undefined ? phase : ph); const th = (LM_BASE + spoke * 360 / LM.m + p * 180 / LM.m) * Math.PI / 180; return { x: CX + LM.mcR * Math.cos(th), y: CY + LM.mcR * Math.sin(th) }; },
    guide(svg){
      const ring = r => { const c = document.createElementNS(NS, 'circle');
        c.setAttribute('cx', CX); c.setAttribute('cy', CY); c.setAttribute('r', r);
        c.setAttribute('fill', 'none'); c.setAttribute('stroke', '#2c3352'); c.setAttribute('stroke-dasharray', '4 6');
        svg.appendChild(c); };
      ring(LM.Ri); ring(LM.Ro);
      for (let k = 0; k < LM.m; k++){ const mc = FORMATIONS.linea.miniCenter(k);
        const c = document.createElementNS(NS, 'circle');
        c.setAttribute('cx', mc.x); c.setAttribute('cy', mc.y); c.setAttribute('r', LM.R2);
        c.setAttribute('fill', 'none'); c.setAttribute('stroke', '#3a2f66'); c.setAttribute('stroke-dasharray', '2 5');
        svg.appendChild(c); }
    },
  },
};
// Línea Moderna geometry, filled by FORMATIONS.linea.compute(n): {m, R2, d2, Ri, di, mcR, Ro, doO}.
let LM = { m: 2, R2: 57, d2: 0.6, Ri: 57, di: 0.6, mcR: 105, Ro: 146, doO: 0.2 };
let LM_GAP = 1;   // outer-ring separation as a fraction of a textbook 2-couple wheel (1 = exact mini-wheels)
// Angle of Línea spoke 0 (degrees). −90 (straight up) at rest; the Línea Moderna entry movement sets it
// to the segundos' own spoke so the formation lands on the orientation the wheel was already in.
let LM_BASE = -90;
// A couple entering Línea turns over the first LM_ROT_SPAN of its walk rather than the whole of it: the
// primeros pivot early instead of still swinging as they arrive, which keeps a leader from cutting near
// the wheel centre mid-turn (at 4 couples the inner ring is tiny — turning throughout brought the two
// primero leaders to 35px; turning early holds them at 45px, for a modest rise in turn rate).
let LM_ROT_SPAN = 0.75;

/* ------------------------------ state ------------------------------ */
let N = 4, layoutName = 'circle', dancers = [], history = [], stepCount = 0, animating = false;
let logCount = 0;             // the call log numbers CALLS; stepCount counts movements (undo bookkeeping)
let speedMul = 1;             // tempo multiplier from the slider (0.2×…1×…2×, 1 = base tempo)
const BASE_MS_PER_BEAT = 400; // base musical tempo; a movement lasts (its beats) × ms-per-beat
let beatCursor = 0;           // total beats danced so far; (beatCursor % 8) is the current beat of the measure
let justIssued = false;       // the next movement is the first of a freshly-issued call → snap to its start beat
let beatRunning = true;       // is the metronome ticking?
let animGen = 0;              // bumped to abort an in-flight animation (e.g. on Reset)
let posState = 'casino';                 // 'casino' | 'dile' (Dile Que No position)
let phase = 0;                           // which of the two spoke configs the wheel rests in (0 or 1)
// The cantante — the leader who calls the figures. He is couple 1's leader (shown with a gold ring), and
// couples are counted clockwise from his, which is what fixes the primeros/segundos split in Línea Moderna.
const cantanteId = 'L0';
const histPos = [];                      // parallel undo stack for posState
const histPhase = [];                    // parallel undo stack for phase
const histLayout = [];                   // parallel undo stack for layoutName + LM_BASE (formation changes)
/* Resting positions, decomposed into fields so engine logic reads structure instead of branching on
 * strings: `variant` is the couple's stance (casino ↔ exhibela), `inverted` is the inside-out (afuera)
 * flag, `virtual` is the non-inverted position whose rules an afuera position follows, `name` is the UI
 * label. (This also retires the old overload where 'enchufla' named both a position and a movement.) */
const POSITIONS = {
  casino:          { variant: 'casino',   inverted: false, virtual: 'casino',   name: 'Casino position' },
  exhibela:        { variant: 'exhibela', inverted: false, virtual: 'exhibela', name: 'Exhibela position' },
  afuera:          { variant: 'casino',   inverted: true,  virtual: 'casino',   name: 'Afuera Casino position' },
  afuera_exhibela: { variant: 'exhibela', inverted: true,  virtual: 'exhibela', name: 'Afuera Exhibela position' },
  // Dile Que No position: both dancers on the couple's midpoint spoke — leader on the OUTER lane
  // (outside the ring) facing the centre, follower on the INNER lane (inside the ring) facing
  // perpendicular to the spoke (clockwise). Reached by the 4-beat Dile Que No; a resting state.
  dile:            { variant: 'dile',     inverted: false, virtual: 'dile',     name: 'Dile Que No position' },
  /* The same place with the wheel inside out — the roles' lanes swap, so the leader stands a step
   * TOWARD the centre and the follower a step away. It exists for the same reason `afuera` does: Línea
   * Moderna's inner ring is a rueda dancing inverted, and a grande figure composed from the LM Dile Que
   * No position has to be able to say where that ring stands. Without it there was no grande Mujeres
   * Arriba, because there was no grande Dile Que No position to dance one from. */
  afuera_dile:     { variant: 'dile',     inverted: true,  virtual: 'dile',     name: 'Afuera Dile Que No position' },
  // Rueda Línea Moderna resting state (two rings). Its own variant so no circle default (Dile Que No)
  // fires and circle-only calls/movements gate off from it.
  linea:           { variant: 'linea',    inverted: false, virtual: 'linea',    name: 'Línea Moderna Casino position' },
  /* THE Línea Moderna Exhibela position — one of them. There used to be two, `linea_ex` for where a

   * every couple in Exhibela on the two rings. Keeping them apart is what made the engine believe a
   * Pequeña had to follow a Pequeña — availability was reading the previous MOVEMENT rather than the
   * resulting POSITION. Sam: "movement possibility shouldn't be based on the previous movement, it should
   * be based on the new position." Everything dancable from here is now available from here.
   * `virtual` points at itself so a movement's function-based `sets` (e.g. Adios's toggle) can tell
   * linea from linea_ex (resolveSets passes virtualPos(from)). */
  linea_ex:        { variant: 'linea',    inverted: false, virtual: 'linea_ex',  name: 'Línea Moderna Exhibela position' },
  // Línea Moderna Dile Que No: both partners on their own mini wheel's midpoint spoke (which runs along
  // the main spoke), leader a step further out from the mini centre, follower a step in. A resting state,
  // reached by the 4-beat Dile Que No Pequeña from LM Exhibela.
  linea_dile:      { variant: 'linea',    inverted: false, virtual: 'linea_dile', name: 'Línea Moderna Dile Que No position' },

const INVERTED_OF = { casino: 'afuera', exhibela: 'afuera_exhibela', dile: 'afuera_dile' };   // entering afuera from a non-inverted position
let callBtns = {}, moveBtns = {};
// call engine state
let mode = 'live';            // 'live' (queue calls freely) | 'step' (pause at each decision point)
let queue = [];               // pending movement keys for the current call + its continuations
/* A CALL IS THE UNIT, A MOVEMENT IS NOT. `queue` holds movement keys because that is what the engine
 * runs, but the caller shouted CALLS and the display owes them calls back. `queueCalls` is parallel to
 * `queue` and holds, for each queued movement, a reference to the CALL INSTANCE that put it there.
 *
 * An instance, not a label. Two Dames chained back to back are two entries in the queue and must stay
 * two — collapsing the movement list by label would silently merge them into one, and a caller watching
 * their second Dame vanish would be right to distrust the whole panel. Identity by `id` cannot merge
 * two separate shouts of the same call, and shares freely across the several movements of one call. */
let callSeq = 0;
const mkCall = label => ({ id: ++callSeq, label });
let queueCalls = [];          // parallel to queue: the call INSTANCE that owns each queued movement
let engineActive = false;     // a call sequence (including the auto Dile Que No) is underway
let awaiting = false;         // step mode: paused at a decision point waiting for a call / silence
let pendingDefault = null;    // the movement 'silence' would run at the current pause
let pendingInterrupt = null;  // a diverting call (con Exhibela) waiting to apply at the next interruption point
/* A pending interrupt is a QUEUED CALL that happens not to live in `queue` — it waits for an
 * interruption point rather than a slot. The caller shouted it and expects to see it, so it shows at the
 * BOTTOM of the queue: `nextMovement` drains `queue` first, so the interrupt really does run last. */
let pendingCall = null;       // the call instance behind pendingInterrupt, for display
let currentCall = null;       // the call INSTANCE whose movement is running NOW (null = a raw movement / idle)
let currentMoveLabel = null;  // the movement currently animating (null = idle) — shown top-left as "Call: Movement"
const histQueue = [];         // parallel undo stack for the queue
const histQueueCalls = [];    // parallel undo stack for queueCalls
/* INTERRUPTION POINTS ARE DERIVED, NOT LISTED. A call only takes effect right before a Dame or before a
 * Dile Que No — but this was a hand-written set of three CIRCLE keys, and Línea Moderna dances the same
 * figures under derived names. `dame_grande` was not in it, so `interruptionPointAhead()` could not see
 * the juncture before an Adios Grande's closing Dame and con Exhibela greyed out for the whole figure.
 * Sam: "I don't seem to be able to call 'con Exhibela' as an interruption move in Linea Moderna. I tried
 * doing it during an Adios Grande."
 *
 * So the three base figures declare `interrupt: true` and the Línea builder carries the flag onto every
 * form it mints. A future formation that derives new names gets its interruption points for free, and
 * cannot quietly lose them the way this one did. Every form the Línea builder mints is already in
 * MOVEMENTS by the time this line runs, so the whole family falls out of one filter. */
const INTERRUPTIBLE = new Set(Object.keys(MOVEMENTS).filter(k => MOVEMENTS[k].interrupt));

function baseState(n){
  if (layoutName === 'linea') return lineaBaseState(n);
  const ds = [];
  for (let i = 0; i < n; i++){
    ds.push({ id: 'L' + i, role: 'L', couple: i, station: i, lane: 'ccw' });
    ds.push({ id: 'F' + i, role: 'F', couple: i, station: i, lane: 'cw'  });
  }
  return ds;
}
// Línea Moderna base state: n couples (n even) split into m = n/2 inner (afuera Casino) + m outer
// (Casino), one inner+outer pair per spoke. Inner couples are ids 0,2,4… at stations 0..m-1; outer
// couples are ids 1,3,5… at stations m..2m-1 (same spoke k = station-m). Lanes give each couple its
// resting look: inner = afuera Casino (leader on the cw side), outer = Casino (leader on the ccw side).
function lineaBaseState(n){
  const m = n / 2, ds = [];
  for (let k = 0; k < m; k++){
    const ic = 2 * k, oc = 2 * k + 1;                 // inner / outer couple ids (0-indexed; shown +1)
    ds.push({ id: 'L' + ic, role: 'L', couple: ic, station: k,     lane: 'cw'  });   // inner (afuera Casino) leader
    ds.push({ id: 'F' + ic, role: 'F', couple: ic, station: k,     lane: 'ccw' });   // inner follower
    ds.push({ id: 'L' + oc, role: 'L', couple: oc, station: m + k, lane: 'ccw' });   // outer (Casino) leader
    ds.push({ id: 'F' + oc, role: 'F', couple: oc, station: m + k, lane: 'cw'  });   // outer follower

}
function pos(d){ return d.xy ? d.xy : FORMATIONS[layoutName].slot(d.station, d.lane, N); }

/* ------------------------------------------------------------------ *
 *  Wheel context — the geometry the circle movement generators read
 *  from module scope (centre, radius, within-couple angle, phase, couple
 *  count, spoke-0 angle) plus the dancers array and active layout. A
 *  composite formation (Línea Moderna) runs an existing circle generator
 *  against a *sub-wheel* by swapping these to that sub-wheel, running the
 *  generator (synchronously), then restoring. `runOnWheel` guarantees the
 *  restore even if the generator throws.
 * ------------------------------------------------------------------ */
function wheelContext(){ return { CX, CY, R_RING, DELTA_DEG, phase, N, BASE_ANG, layoutName, dancers }; }
function setWheelContext(c){
  CX = c.CX; CY = c.CY; R_RING = c.R_RING; DELTA_DEG = c.DELTA_DEG;
  phase = c.phase; N = c.N; BASE_ANG = c.BASE_ANG; layoutName = c.layoutName; dancers = c.dancers;
}
// Run `gen()` (a circle movement generator) with the geometry globals + dancers set to a sub-wheel.
// `ctx` overrides any of {CX,CY,R_RING,DELTA_DEG,phase,N,BASE_ANG}; layout is forced to 'circle' so
// pos()/slot() use circle geometry. Returns whatever gen() returns (frames or {frames,segBeats}).
function runOnWheel(ctx, subDancers, gen){
  const saved = wheelContext();
  try { setWheelContext({ ...saved, ...ctx, layoutName: 'circle', dancers: subDancers }); return gen(); }
  finally { setWheelContext(saved); }
}

/* Facing is a property of layout + role (+ couple parity in línea), NOT of
 * the partner. In Rueda leaders face clockwise round the wheel, followers
 * anti-clockwise. In Línea Moderna couples alternate up/down down the line. */
/* ------------------------------------------------------------------ *
 *  DECLARATIVE VOCABULARY  (see DECLARATIVE.md)
 *
 *  The two things a movement definition has to be able to SAY, defined once and precisely, so that a
 *  movement means the same thing at 4 couples as at 8 and in either phase:
 *
 *    · WHICH dancers an intent applies to      -> group predicates      (`GROUPS`, `selectGroup`)
 *    · WHERE a traveller lands                 -> relative slot address (`placeOf`, `resolvePlace`)
 *
 *  Both are pure functions of the formation, never of pixels.
 * ------------------------------------------------------------------ */

/* The lane each role rests in, per circle position — the single source of truth, read by the slot
 * vocabulary and by the tests instead of each carrying its own copy. (The Línea positions are not here:
 * their lanes depend on which ring a couple is on, and their generators set `lane` explicitly.) */
const REST_LANES = {
  casino:          { L: 'ccw',   F: 'cw'    },
  exhibela:        { L: 'cw',    F: 'ccw'   },
  afuera:          { L: 'cw',    F: 'ccw'   },   // Afuera Casino looks like Exhibela
  afuera_exhibela: { L: 'ccw',   F: 'cw'    },   // Afuera Exhibela looks like Casino
  dile:            { L: 'outer', F: 'inner' },
  afuera_dile:     { L: 'inner', F: 'outer' },   // inside out: his step out from the ring points inward
  /* THE LÍNEA DILE QUE NO POSITION IS HERE, unlike the other Línea states, and the exception is principled:
   * its lanes do NOT depend on which ring a couple is on. `FORMATIONS.linea.slot` already flips the sign
   * for the inner ring inside the 'outer'/'inner' branch, so both rings name the same two lanes and the
   * geometry does the rest.
   *
   * Without this the dancers kept whatever lane they were standing in before the 4-beat Dile Que No — the
   * Exhibela cw/ccw — and anything that addresses a slot by (spoke, lane) was reading a lane that no
   * longer described where they were. A Dame Grande danced from here put two dancers 0.00px apart. */
  linea_dile:      { L: 'outer', F: 'inner' },
};
/* `lane` must be AUTHORITATIVE after a movement, not a souvenir of where the dancer started. Most circle
 * generators carry `lane` through untouched — harmless while `pos()` prefers the live `xy`, but wrong the
 * moment anything addresses a slot by (spoke, lane), which is exactly what the declarative vocabulary
 * does. Every movement lands in a RESTING position whose lanes are defined, so snap them from it. */
function snapRestLanes(frame){
  const t = REST_LANES[posState]; if (!t) return;                  // Línea positions set `lane` themselves
  (frame || dancers).forEach(d => { d.lane = t[d.role]; });
}

/* A dancer's PLACE, in the coordinates the engine actually reasons in.
 *   h    — the couple's midpoint spoke, in HALF-couple spacings: h = 2·station + phase, modulo 2N.
 *          Half-spacings rather than couples because the figures genuinely use them: a Dame moves its
 *          leader an ODD number of half-spacings (that is *why* it always flips the phase), and the
 *          follower one the other way. Counting in couples cannot express either.
 *   lane — which slot of the couple ('cw' | 'ccw' | 'inner' | 'outer').
 *   ring — which ring of a multi-ring formation ('inner' | 'outer'); the circle has a single ring. */
function placeOf(d, n, ph){
  const N_ = n === undefined ? N : n, P = ph === undefined ? phase : ph;
  const F = FORMATIONS[layoutName], m = N_ / 2;
  if (layoutName === 'linea'){
    const inner = d.station < m, spoke = inner ? d.station : d.station - m;
    return { h: (2 * spoke + P) % (2 * m), lane: d.lane, ring: inner ? 'inner' : 'outer', span: 2 * m };
  }
  return { h: (2 * d.station + P) % (2 * N_), lane: d.lane, ring: 'only', span: 2 * N_ };
}

/* A relative move between places — the canonical way a movement says where a traveller lands.
 *   { dh, lane, ring }
 *     dh   signed half-couple spacings, POSITIVE = clockwise (the direction station index increases).
 *     lane the lane landed in; 'same' keeps it, 'swap' takes the couple's other on-ring lane.
 *     ring 'same' | 'inner' | 'outer' | 'swap'.
 * Couple-count independent and phase independent by construction: `dh` is a count of spacings, and the
 * phase is carried in `h`, so the same reference resolves correctly from either config. */
const LANE_SWAP = { cw: 'ccw', ccw: 'cw', inner: 'outer', outer: 'inner' };
function resolvePlace(p, ref, n, phAfter){
  const span = p.span, dh = ref.dh || 0;
  const h = (((p.h + dh) % span) + span) % span;
  const lane = !ref.lane || ref.lane === 'same' ? p.lane : ref.lane === 'swap' ? LANE_SWAP[p.lane] : ref.lane;
  const ring = !ref.ring || ref.ring === 'same' ? p.ring : ref.ring === 'swap' ? LANE_SWAP[p.ring] : ref.ring;
  // Read the station back off h at the phase the wheel will REST in, so a movement that flips the phase
  // and one that doesn't both land on the grid. (h is odd iff the resting phase is 1, by construction.)
  const P = phAfter === undefined ? phase : phAfter;
  const spokes = span / 2, spoke = (((h - P) / 2) % spokes + spokes) % spokes;
  const station = (layoutName === 'linea' && ring === 'outer') ? spoke + spokes : spoke;
  return { h, lane, ring, span, station };
}

/* Structural group predicates — the vocabulary a movement uses to say WHICH dancers do what.
 * Structural, never positional-by-index: `primeros` means "the cantante's couple and every other one
 * clockwise", so it still means the right thing at a different couple count, which an explicit list of
 * couple numbers would not. Compose with `and` / `not`. */
const GROUPS = {
  all:       () => true,
  leaders:   d => d.role === 'L',
  followers: d => d.role === 'F',
  primeros:  (d, c) => c.parity(d) === 0,
  segundos:  (d, c) => c.parity(d) === 1,
  inner:     (d, c) => c.place(d).ring === 'inner',
  outer:     (d, c) => c.place(d).ring === 'outer',
};
function groupContext(ds, n, ph){
  const N_ = n === undefined ? N : n;
  const cant = ds.find(d => d.id === cantanteId) || ds.find(d => d.role === 'L');
  const c0 = cant ? cant.station : 0;
  const placeCache = {};
  return {
    // Parity is counted CLOCKWISE FROM THE CANTANTE's couple, which is what anchors primeros/segundos.
    parity: d => ((((d.station - c0) % N_) + N_) % N_) % 2,
    place: d => placeCache[d.id] || (placeCache[d.id] = placeOf(d, N_, ph)),
  };
}
function selectGroup(ds, pred, n, ph){
  const c = groupContext(ds, n, ph);
  const test = typeof pred === 'function' ? pred
    : Array.isArray(pred) ? (d => pred.every(k => GROUPS[k](d, c)))     // an array is an AND
    : GROUPS[pred];
  return ds.filter(d => test(d, c));
}

/* ------------------------------------------------------------------ *
 *  SCRIPTED FIGURES — the beat-level primitive library (DECLARATIVE.md §6)
 *
 *  A scripted figure is a chain of BEAT-LEVEL SEGMENTS danced in the dancer's OWN frame. Nothing a
 *  segment can name mentions another couple, which is what makes scripted figures collision-unaware by
 *  construction rather than by discipline — they are choreography, and traffic is `planCrossings`' job.
 * ------------------------------------------------------------------ */

/* The local frame. `out` is the couple's midpoint spoke pointing away from the wheel centre — the
 * "Exhibela line" every in-place figure travels along; `cw` is perpendicular to it, clockwise round the
 * wheel. Landmarks: own start `S`, partner's start `P`, couple midpoint `M`. */
function dancerFrame(d, ds){
  const S = pos(d);
  const pr = ds.find(o => o.station === d.station && o.role !== d.role);
  const P = pr ? pos(pr) : S;
  const M = { x: (S.x + P.x) / 2, y: (S.y + P.y) / 2 };
  const a = Math.atan2(M.y - CY, M.x - CX);
  const out = { x: Math.cos(a), y: Math.sin(a) };
  const cw = { x: -out.y, y: out.x };
  return { S, P, M, out, cw, spokeAng: a,
    atPartner: Math.atan2(P.y - S.y, P.x - S.x) * 180 / Math.PI };
}

/* Where a segment ends, resolved in the frame.
 *   'start' | 'partner' | 'midpoint' | 'hold'   — named landmarks ('hold' = stay where you are)
 *   { spoke: ±1 }                               — the Dile Que No lane on the couple's own spoke
 *   { off: [alongOut, alongCw], from }          — an offset from 'start' (default) or 'prev' */
function landmarkAt(fr, prev, spec){
  if (spec === 'start') return fr.S;
  if (spec === 'partner') return fr.P;
  if (spec === 'midpoint') return fr.M;
  if (spec === 'hold') return prev;
  if (spec.spoke !== undefined){ const r = R_MID() + spec.spoke * R_STEP;
    return { x: CX + r * Math.cos(fr.spokeAng), y: CY + r * Math.sin(fr.spokeAng) }; }
  const b = spec.from === 'prev' ? prev : fr.S, o = spec.off;
  return { x: b.x + fr.out.x * o[0] + fr.cw.x * o[1], y: b.y + fr.out.y * o[0] + fr.cw.y * o[1] };
}

/* Facing rules, evaluated per frame with u = progress through the segment.
 *   'partner'                        — face the partner's LIVE position (so it tracks a moving partner)
 *   'partner0'                       — face where the partner STARTED: a fixed bearing, not a track
 *   'partnerEnd'                     — face where your new partner LANDS: the bearing both of you settle
 *                                      onto, known before the movement starts
 *   'centre' | 'outward'             — along the spoke
 *   'perpSpoke'                      — ⟂ to the spoke, clockwise round the wheel
 *   'travel'                         — the direction of travel
 *   'hold'                           — keep the facing the previous segment ended on
 *   { from, to, after, dir, ease, freeze }
 *                                    — hold bearing `from`, then turn onto `to` over the rest of the
 *                                      segment (from fraction `after`); `dir` forces cw/ccw the long
 *                                      way round when the figure says so; `freeze` pins the starting
 *                                      bearing at the moment the turn begins rather than tracking it
 *   { blend: [a, b] }                — sweep from bearing a to bearing b across the segment
 *   { settleTo, over }               — face the way you travel, then settle onto a bearing over the
 *                                      last `over` of the segment
 *   { from, at, turn, endAt }        — start from a base facing (plus a constant `at`) and rotate `turn`
 *                                      degrees across the
 *                                      segment; `endAt` pins the exact value at u = 1 (a 360° spin ends
 *                                      on its start value, not on start+360). */
function faceAt(rule, fr, u, ctx){
  if (rule === undefined || rule === 'hold') return ctx.prevFace;
  const base = r => typeof r === 'number' ? r               // a literal bearing, already resolved
    : r === 'partner' ? (ctx.partnerXY
        ? Math.atan2(ctx.partnerXY.y - ctx.here.y, ctx.partnerXY.x - ctx.here.x) * 180 / Math.PI : fr.atPartner)
    : r === 'partner0'  ? fr.atPartner                     // toward where the partner STARTED (a fixed bearing)
    : r === 'partnerEnd' ? (ctx.partnerEnd != null ? ctx.partnerEnd : fr.atPartner)   // toward where they LAND
    : r === 'centre'    ? Math.atan2(CY - ctx.here.y, CX - ctx.here.x) * 180 / Math.PI
    : r === 'outward'   ? Math.atan2(ctx.here.y - CY, ctx.here.x - CX) * 180 / Math.PI
    : r === 'perpSpoke' ? Math.atan2(fr.out.x, -fr.out.y) * 180 / Math.PI
    : r === 'travel'    ? (ctx.travel != null ? ctx.travel : ctx.prevFace)
    : r === 'start'     ? ctx.face0
    : ctx.prevFace;
  if (typeof rule === 'string') return base(rule);
  const shortD = (to, from) => ((to - from + 540) % 360 + 360) % 360 - 180;
  // Hold one bearing, then TURN ONTO another over the rest of the segment. `dir` forces the long way
  // round when the figure says so — a leader who turns to his right turns right even when left is
  // shorter, which a short-way blend would silently reverse.
  if (rule.to !== undefined && rule.from !== undefined){
    const after = rule.after || 0;
    // `freeze` pins the starting bearing at the moment the turn begins, instead of tracking a base that
    // is still moving. A dancer spinning onto a new partner turns a DEFINITE amount from wherever she
    // happened to be pointing; without this she chases a bearing that shifts under her as she travels.
    const a = (rule.freeze && u >= after && ctx.frozen != null) ? ctx.frozen : base(rule.from);
    const b2 = base(rule.to);
    const w = after >= 1 ? 0 : Math.max(0, (u - after) / (1 - after));
    const e = rule.ease === 'linear' ? w : _smooth(w);
    let d2 = shortD(b2, a);
    if (rule.dir === 'cw' && d2 < 0) d2 += 360;
    if (rule.dir === 'ccw' && d2 > 0) d2 -= 360;
    return a + d2 * e;
  }
  // Blend across the segment from one bearing to another (e.g. from facing your partner to facing the
  // centre), taking the short way round.
  if (rule.blend){ const a = base(rule.blend[0]), b2 = base(rule.blend[1]);
    return a + shortD(b2, a) * u; }
  // Face the way you travel, then SETTLE onto a target bearing over the last `over` of the segment.
  if (rule.settleTo !== undefined){ const tv = base(rule.from || 'travel'), t2 = base(rule.settleTo);
    return tv + shortD(t2, tv) * _smooth(Math.max(0, (u - (1 - rule.over)) / rule.over)); }
  const b = base(rule.from || 'start') + (rule.at || 0);   // `at` is a constant offset from the base bearing
  if (u >= 1 && rule.endAt !== undefined) return rule.endAt === 'base' ? b : base(rule.endAt);
  return b + (rule.turn || 0) * u;
}

/* Play a scripted figure: segments -> frames. Each segment is
 *     { to, beats, steps, ease, face, turn }
 * `ease` is 'linear' (default) or 'smooth'; `turn` is the render hint ('cw'/'ccw') for the spin
 * direction. Returns { frames: [[{id, xy, face, turn}]], segBeats }. */
function playScript(ds, plan){
  const fr = {}, prevFace = {}, face0 = {};
  ds.forEach(d => { fr[d.id] = dancerFrame(d, ds); prevFace[d.id] = face0[d.id] = facingAngle(d); });
  const segs = {}; ds.forEach(d => segs[d.id] = plan(d));
  const nSeg = Math.max(...ds.map(d => segs[d.id].length));
  // Resolve the whole endpoint chain up front: landmarks depend only on the frame and the previous
  // endpoint, never on live positions, so a figure's shape is fully known before a frame is drawn.
  const ends = {};
  ds.forEach(d => { let p = fr[d.id].S; ends[d.id] = segs[d.id].map(sg =>
    p = landmarkAt(fr[d.id], p, sg.to === undefined ? 'hold' : sg.to)); });
  // Group segments into PHASES. A segment marked `round: true` is merged with its predecessor into one
  // rounded curve (see roundedPath) instead of the two meeting at a corner.
  const phases = [];
  for (let i = 0; i < nSeg; i++){
    const merged = ds.some(d => (segs[d.id][i] || {}).round);
    if (merged && phases.length) phases[phases.length - 1].push(i); else phases.push([i]);
  }
  const frames = [], segBeats = [];
  const start = {}; ds.forEach(d => start[d.id] = fr[d.id].S);
  phases.forEach(ph => {
    const of = (d, i) => segs[d.id][i] || {};
    const steps = Math.max(...ds.map(d => ph.reduce((a, i) => a + (of(d, i).steps || 1), 0)));
    const beats = Math.max(...ds.map(d => ph.reduce((a, i) => a + (of(d, i).beats || 0), 0)));
    const A = {}, curve = {};
    ds.forEach(d => { A[d.id] = start[d.id];
      if (ph.length > 1){
        // Rounded join: one quadratic Bézier from where the first segment began, with the JOINT as its
        // control point, to where the last one ends — resampled by arc length so the speed stays even
        // round the bend. Two straight legs meeting at the joint turn a hard corner there (61° in the
        // Dile Que No opening before this was applied by hand; 8° after).
        const P0 = A[d.id], C = ends[d.id][ph[0]], P2 = ends[d.id][ph[ph.length - 1]], pts = [];
        for (let i = 0; i <= 24; i++){ const u = i / 24, v = 1 - u;
          pts.push({ x: v * v * P0.x + 2 * v * u * C.x + u * u * P2.x,
                     y: v * v * P0.y + 2 * v * u * C.y + u * u * P2.y }); }
        curve[d.id] = arcLenPath(pts);
      }
    });
    const last = ph[ph.length - 1];
    for (let k = 1; k <= steps; k++){
      const raw = k / steps;
      const P = {}; ds.forEach(d => {
        if (curve[d.id]){ P[d.id] = curve[d.id](raw); return; }
        const sg = of(d, last), B = ends[d.id][last] || A[d.id];
        const u = sg.ease === 'smooth' ? _smooth(raw) : raw;
        if (sg.orbit){
          // A HALF-TURN about the midpoint of the segment's own start and end — which is why it lands on
          // `to` exactly. `pinch` flattens the bulge toward the start→end chord, keeping a turning couple

      const pc = (a2, b2) => { const gate = gateOf(a2, b2);
        const mMax = Math.min(SMP2, Math.floor(gate * SMP2));
        let m2 = Infinity, tc = 0.5;
        for (let m = 0; m <= mMax; m += 2){
          const A2 = atESmp(a2, m), B2 = atESmp(b2, m);
          const d2 = Math.hypot(A2.x - B2.x, A2.y - B2.y);
          if (d2 < m2){ m2 = d2; tc = m / SMP2; } }
        return { gap: m2, tc }; };
      const conf = [];
      for (const pr of checkPairs){
        const r = pc(pr[0], pr[1]);
        if (r.gap >= HOLD) continue;
        const A = atE(pr[0], r.tc), B = atE(pr[1], r.tc);
        const mid = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
        conf.push({ a: pr[0], b: pr[1],
          depth: Math.hypot(mid.x - centreOfFormation.x, mid.y - centreOfFormation.y) });
      }
      conf.sort((x, y) => x.depth - y.depth);
      const W = 2;                                       // bump half-width, in coarse nodes
      const bump = (id2, t, dx2, dy2) => { const u = unit(id2); if (!unitYields[u]) return;
        markLive(u);
        const kc = Math.max(1, Math.min(K_E - 1, Math.round(t * K_E)));
        for (let j = Math.max(1, kc - W); j <= Math.min(K_E - 1, kc + W); j++){
          const f2 = 1 - Math.abs(j - kc) / (W + 1), w = f2 * f2 * (3 - 2 * f2);
          dev[u][j].x += dx2 * w; dev[u][j].y += dy2 * w; } };
      for (const c of conf){
        const r = pc(c.a, c.b);                          // re-measured: earlier placements moved things
        if (r.gap >= HOLD) continue;
        const t = r.tc;
        const A = atE(c.a, t), B = atE(c.b, t);
        const C = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
        const ya = yields2(c.a) && unitYields[unit(c.a)], yb = yields2(c.b) && unitYields[unit(c.b)];
        if (!ya && !yb) continue;
        const axA = sideVecE(c.a, c.b, t);
        if (ya && yb){
          const axB = sideVecE(c.b, c.a, t);
          const opposed = (axA.x * axB.x + axA.y * axB.y) < 0;
          const bDir = opposed ? axB : { x: -axA.x, y: -axA.y };
          /* The seed places at the bare corridor; the loop tops up to its buffered hold only where the
           * measured path is genuinely short. Seeding at the buffered target instead ships the whole
           * figure a berth wider than it needs (measured: a Dame Grande at 1.40x its line where 1.16x
           * clears). */
          bump(c.a, t, C.x + axA.x * (CLEAR / 2) - A.x, C.y + axA.y * (CLEAR / 2) - A.y);
          bump(c.b, t, C.x + bDir.x * (CLEAR / 2) - B.x, C.y + bDir.y * (CLEAR / 2) - B.y);
        } else if (ya){
          bump(c.a, t, B.x + axA.x * CLEAR - A.x, B.y + axA.y * CLEAR - A.y);
        } else {
          const axB = sideVecE(c.b, c.a, t);
          bump(c.b, t, A.x + axB.x * CLEAR - B.x, A.y + axB.y * CLEAR - B.y);
        }
      }
    };
    /* DOING NOTHING IS ALWAYS ON THE TABLE. The baseline is measured on the UNTOUCHED paths before the
     * seed runs — a decisive seed on unsatisfiable geometry scrambles paths it can never clear (measured:
     * the six-dancer ring went from an honest 26.0px standstill to 1.2px of scrambled thrash when the
     * baseline was taken after seeding), and best-iterate can only protect against that if the zero
     * arrangement is in the book. */
    /* The base path is FIXED for the whole solve, so it is sampled once onto the fine grid; every sweep
     * after that pays only the deviation blend, and dormant units pay nothing at all. `o.base` is the
     * expensive half of a sample (polar arcs, loops, scripted figures). */
    const SMP2 = 2 * NSMP;
    const baseGrid = {};
    const baseAtSmp = (id, m) => { let g = baseGrid[id];
      if (!g){ g = baseGrid[id] = new Array(SMP2 + 1);
        for (let i2 = 0; i2 <= SMP2; i2++) g[i2] = o.base(id, i2 / SMP2); }
      return g[m]; };
    const atESmp = (id, m) => {
      const p = baseAtSmp(id, m);
      const u = unit(id);
      if (!devLive[u]) return p;
      const d = devAt(u, m / SMP2);
      const q = { x: p.x + d.x, y: p.y + d.y };
      if (!o.orbit) return q;
      const dx = q.x - o.orbit.x, dy = q.y - o.orbit.y, r = Math.hypot(dx, dy);
      if (r >= RFLOOR || r < 1e-9) return q;
      return { x: o.orbit.x + dx / r * RFLOOR, y: o.orbit.y + dy / r * RFLOOR };
    };
    const measureWorst = () => { let w = Infinity;
      for (const pr of checkPairs){ const gate = gateOf(pr[0], pr[1]);
        const mMax = Math.min(SMP2, Math.floor(gate * SMP2));
        for (let m0 = 0; m0 <= mMax; m0 += 4){
          const A0 = atESmp(pr[0], m0), B0 = atESmp(pr[1], m0);
          const d0 = Math.hypot(A0.x - B0.x, A0.y - B0.y);
          if (d0 >= DENSE){ if (d0 < w) w = d0; continue; }
          const mEnd = Math.min(mMax, m0 + 3);
