   * follower on the left." `partner0` and `partner1` say precisely that — the woman you came in with and
   * the woman you are going to, which is a distinction the Dile Que No position needs and the others do
   * not, because from there he leaves round the back of her. */
  /* ONE TRAVEL FOR BOTH ANTI-CLOCKWISE FORMS, and one side table with it. Casino and the Dile Que No
   * position send the outer leader the long way round — 133° at six couples against the clockwise form's
   * 86° — so he meets his own wheel on the way out and the wheel next door on the way in. Their slots and
   * their sides are the same statement, character for character; what differs is the FOLLOWER'S FIGURE
   * (she walks to her lane from Casino, and dances her ¾ circle from the Dile Que No position), and that
   * lives on the movement's `script`, not here. Two names for one travel is exactly what §46 exists to
   * catch — it caught these — and `dame_pequena` already shares `dile_dame` the same way.
   *
   * Measured with the per-wheel sides: 36.0 / 39.1 / 39.2px at 4, 6 and 8 couples against a 35px
   * corridor, no unsatisfiable pairs. On the bare rueda default the same journey closes to 4.3px at six. */
  dame_ene_acw:      { groups: ['L', 'F'], passes: ENE_PASSES_ACW,
                       'outer,L': eneOuterL(-2), 'inner,L': ENE_INNER_L, F: ENE_F },
  dame_ene_exhibela: { groups: ['L', 'F'], passes: PASSES_RUEDA,
                       'outer,L': eneOuterL(2),  'inner,L': ENE_INNER_L, F: ENE_F },
};
/* ------------------------------------------------------------------ *
 *  WHICH DANCERS A CLAUSE IS ABOUT — a travel's keys are GROUP SELECTORS.
 *
 *  `L:` and `F:` are not special; they are one-predicate selectors, aliases for `leaders` and
 *  `followers`, and they carry on reading exactly as they always did. What is new is that a clause may
 *  name any conjunction from `GROUPS`: `'outer,L'` is the outer ring's leaders, `'inner,F'` the inner
 *  ring's followers, `'primeros,L'` every other leader from the cantante round.
 *
 *  WHY. Every figure so far does one thing per role, so a role table was the whole vocabulary. The
 *  roadmap's cross-wheel progressions are not like that: in Dame Ene three of the four dancers in a
 *  mini-wheel dance their ordinary Dame Pequeña and the OUTER LEADER alone does something else. Written
 *  as a role table that is two movements, or one movement with a conditional inside the engine. Written
 *  as selectors it is one clause: state the exception, inherit the rest.
 *
 *  MOST SPECIFIC WINS, by predicate count — `'outer,L'` (two) beats `'L'` (one), which is the reading
 *  that makes "everyone does X, except these" expressible in the order an author thinks it. A tie is an
 *  AMBIGUITY, not a precedence puzzle to be resolved by key order, and a dancer matched by nothing is a
 *  HOLE; both are recorded here and asserted away by §49 rather than being silently survivable, because
 *  either one means the movement does not say what its author thinks it says.
 * ------------------------------------------------------------------ */
const TRAVEL_META_KEYS = new Set(['groups', 'passes']);
const SELECTOR_ALIAS = { L: 'leaders', F: 'followers' };
const selectorPreds = key => key.split(',').map(s => SELECTOR_ALIAS[s.trim()] || s.trim());
// Clauses that two dancers could both claim, and dancers no clause claims. Empty is the contract (§49).
const TRAVEL_AMBIGUOUS = [], TRAVEL_UNCOVERED = [];
/* Resolve every dancer to the clause that governs them, once per travel rather than per lookup — the
 * predicates read positions, and a movement resolves the same dancer from `target`, `yields` and the
 * lane in three different places. */
function travelClauses(def, ds, n, ph, tag){
  const keys = Object.keys(def).filter(k => !TRAVEL_META_KEYS.has(k));
  const ctx = groupContext(ds, n, ph);
  const out = {};
  ds.forEach(d => {
    let best = null, bestN = -1, tie = null;
    for (const k of keys){
      const preds = selectorPreds(k);
      if (!preds.every(p => GROUPS[p] && GROUPS[p](d, ctx))) continue;
      if (preds.length > bestN){ best = k; bestN = preds.length; tie = null; }
      else if (preds.length === bestN) tie = k;
    }
    if (tie) TRAVEL_AMBIGUOUS.push({ tag, id: d.id, a: best, b: tie });
    if (!best) TRAVEL_UNCOVERED.push({ tag, id: d.id, role: d.role, keys });
    out[d.id] = best ? def[best] : {};
  });
  return out;
}
/* Turn a travel definition into the options `playTravel` takes. `o` supplies the engine-side wiring a
 * definition cannot state: the scripted roles' paths, any facing rules, and the beat/step budget. */
function resolveTravel(name, ds, o){
  const def = typeof name === 'string' ? TRAVELS[name] : name;
  const mir = o.mirror ? -1 : 1;
  const cl = travelClauses(def, ds, o.n, o.phaseBefore, typeof name === 'string' ? name : '(inline)');
  const laneOf = d => { const l = cl[d.id].lane; return o.mirror ? LANE_SWAP[l] : l; };
  /* WHICH RING A LANDING IS ON, carried the same way the lane is and mirrored the same way. It has
   * always been expressible in a slot address — `resolvePlace` has read `ref.ring` since the Línea
   * places were written — and there has never been a way for a travel to SAY it, so every figure landed
   * on the ring it started on and the one thing Línea's geometry adds over the circle was unreachable
   * from a descriptor. A cross-wheel progression is exactly a landing that names a different ring. */
  const ringOf = d => { const r = cl[d.id].ring; return (o.mirror && (r === 'inner' || r === 'outer')) ? LANE_SWAP[r] : r; };
  const role = {}; ds.forEach(d => role[d.id] = d.role);
  const CLEAR = 2 * (DOT_R + PATH_CLEAR);
  return Object.assign({
    /* EVERYTHING THE CLAUSE SAID, not most of it. `turn` was documented, read by the planner and never
     * put on the reference — so a figure that declared a half turn was planned as if it had declared
     * nothing, which is the exact centre of `directedSweep`'s degeneracy. It is mirrored like `dh`,
     * because a turn is a direction around the wheel and mirroring is what turns the wheel inside out. */
    target: d => cl[d.id].scripted ? null
      : { dh: mir * cl[d.id].dh, lane: laneOf(d), ring: ringOf(d), about: cl[d.id].about,
          turn: cl[d.id].turn === undefined ? undefined : mir * cl[d.id].turn },
    yields: id => !cl[id].scripted,
    group: id => role[id], groups: def.groups,
    clearance: CLEAR, engage: CLEAR + 1.4 * DOT_R,
    /* A definition's own pass sides, NOT mirrored. `mirror` inverts the geometry — dh signs, lanes, which
     * side of the spoke a step lands on — but a pass side is facing-relative, and a dancer's own left is
     * their own left however the wheel is turned inside out. Same reason turns are not mirrored. Measured:
     * the conventions hold unchanged across the afuera positions, which is where the 144/144 in
     * PASSING.md comes from. Mirroring them put 120 shipped passes on the wrong side. */
    /* A PASS SIDE IS NEVER MIRRORED. Not for roles, not for relations, not ever (Sam). `mirror` inverts
     * the geometry — dh signs, lanes, which side of a spoke a step lands on — but which shoulder two
     * dancers go by on is the same dance whichever way round the wheel is turned inside out. I had this
     * wrong twice, in both directions, and each time the measurements looked like they supported the
     * mirror; what they were really showing is that Dame Dos is a bad figure afuera, because holding the
     * side forces the leaders into an enormous journey. That is a fact about the figure, not about the
     * vocabulary — which is why Dame Dos is now banned afuera rather than mirrored into working. */
    passes: def.passes,
  }, o, {
    /* MERGE, NEVER REPLACE. `Object.assign(defaults, o)` would let a play's `opts.passes` swap out the
     * definition's whole map, so overriding one pair meant restating every pair — and forgetting one
     * silently dropped it. (`dame_shared` had to restate all four role keys to change `partner0`.) The
     * override now layers over the definition: name the pair you mean, keep the rest. */
    passes: (o && o.passes) ? Object.assign({}, def.passes, o.passes) : def.passes,
  });
}

/* SCRIPT_KINDS — what a SCRIPTED role does while the other travels, named so a definition can reference
 * it the way it references a solver. One kind covers every case we dance: walk to your own couple's slot
 * in the lane your role lands in, optionally bowing so two partners trading places just miss. Standing
 * still is the same thing when that slot is where you already are, so it needs no separate kind. */
/* FORMATION_CHANGES — a movement that replaces the slot set rather than moving within it. The two
 * directions are named the way script kinds and solvers are; a descriptor states which formation it
 * lands in and which way the travelling couples turn, which is the only thing separating each entry and
 * exit from its Adios-flavoured twin. */
const FORMATION_CHANGES = {
  linea:  (ds, N, turn) => lineaModerna(ds, N, turn),
  circle: (ds, N, turn) => lineaToRueda(ds, N, turn),
  // Dame Línea is a formation change too, but its dancers do NOT travel as bonded couples — each crosses
  // alone to meet a new partner — so it is its own kind rather than a turn direction on the walk.
  linea_dame: (ds, N) => dameLinea(ds, N),
};

/* Below this, a dancer has not moved — she has been left where she was by arithmetic that did not
 * cancel exactly. Slots are discrete, so a real step is tens of pixels and a non-step is ~1e-14: there
 * is nothing in between, and invariants §33 asserts that gap rather than trusting it. Any direction
 * DERIVED from a displacement (a normal, a bearing, a lane side) has to test against this before it
 * normalises, because dividing a residue by its own length yields a confident unit vector pointing
 * nowhere in particular. */
const STILL_PX = 1e-6;
/* Every displacement a DIRECTION has been derived from. Recording rather than asserting keeps the app
 * silent in production and puts the judgement in invariants §33e, which asserts the gap is real: a step
 * is tens of pixels, a non-step is exact, and a value in between means something is about to normalise
 * noise into a confident unit vector. Any future code that takes a bearing from a difference should
 * come through here — that is what makes the check a CLASS check rather than a note about one function. */
const DIR_DERIVATIONS = [];
function dirFrom(vx, vy){
  const len = Math.hypot(vx, vy);
  DIR_DERIVATIONS.push(len);
  return len < STILL_PX ? null : { x: vx / len, y: vy / len, len };
}

const SCRIPT_KINDS = {
  /* The Dile Que No y Dame follower's close: a ¾ circle from her spoke point, out through its mirror on
   * the far side of the ring, and back to the spot she started the movement on. Her couple midpoint never
   * moves, so she is scripted — but the shape is a circle through three known points rather than anything
   * the segment primitives can state, which is why it is a named kind. */
  three_quarter_circle(ds, N, cfg, mirror, who){
    const TWO = 2 * Math.PI, io = mirror ? -1 : 1;
    const circ3 = (A, B, C) => {
      const d = 2 * (A.x * (B.y - C.y) + B.x * (C.y - A.y) + C.x * (A.y - B.y));
      const A2 = A.x*A.x+A.y*A.y, B2 = B.x*B.x+B.y*B.y, C2 = C.x*C.x+C.y*C.y;
      return { x: (A2*(B.y-C.y)+B2*(C.y-A.y)+C2*(A.y-B.y)) / d, y: (A2*(C.x-B.x)+B2*(A.x-C.x)+C2*(B.x-A.x)) / d };
    };
    const at = {};
    ds.filter(who).forEach(d => {
      /* Where she is walking back TO. In the old compound this was remembered from before the 4-beat
       * opening; as a movement in its own right there is nothing to remember, so it resolves from the
       * slot system — which is what it always meant. "Her own spot" is an address, not a souvenir. */
      /* HER OWN SPOT, MIRRORED WHEN THE WHEEL IS. `to_lane` swaps its lane for an inverted wheel and this
       * did not, so on the inner Línea ring the travelling leader aimed for the mirrored side of the
       * spoke while she aimed for the unmirrored one — the same side. Measured on the first figure that
       * could reach it, a Dame Grande from the Línea Moderna Dile Que No position: he and the follower he
       * was walking to landed **0.00px apart**, at 4, 6 and 8 couples alike. Unreachable until now, which
       * is why it survived: the circle has no afuera Dile Que No position to dance a mirrored Dame from,
       * and Línea's grande map did not carry `dile` across until this version. */
      const lane = mirror ? LANE_SWAP[cfg.lane] : cfg.lane;
      const F0 = (cfg.startOf && cfg.startOf[d.id]) || FORMATIONS[layoutName].slot(d.station, lane, N);
      const fr = dancerFrame(d, ds);
      const Xs = { x: CX + R_MID() * fr.out.x, y: CY + R_MID() * fr.out.y };
      const Pf   = { x: Xs.x - io * R_STEP * fr.out.x, y: Xs.y - io * R_STEP * fr.out.y };   // her spoke point
      const Pout = { x: Xs.x + io * R_STEP * fr.out.x, y: Xs.y + io * R_STEP * fr.out.y };   // its mirror
      const O = circ3(Pf, Pout, F0), rho = Math.hypot(Pf.x - O.x, Pf.y - O.y);
      const aA = Math.atan2(Pf.y - O.y, Pf.x - O.x), aB = Math.atan2(Pout.y - O.y, Pout.x - O.x);
      const aC = Math.atan2(F0.y - O.y, F0.x - O.x);
      const nrm = x => ((x % TWO) + TWO) % TWO;
      const dAB = nrm(aB - aA), dAC = nrm(aC - aA);
      const dir = dAB < dAC ? 1 : -1, sweep = dAB < dAC ? dAC : TWO - dAC;
      at[d.id] = t => { const a = aA + dir * sweep * t; return { x: O.x + rho * Math.cos(a), y: O.y + rho * Math.sin(a) }; };
    });
    return at;
  },

  // `ds` is the WHOLE wheel (a solver may need to measure the couple), `who` picks whose paths to build —
  // a predicate rather than a role name, so a script clause is selected exactly as a travel clause is.
  to_lane(ds, N, cfg, mirror, who){
    const lane = mirror ? LANE_SWAP[cfg.lane] : cfg.lane;
    const side = cfg.bow ? (mirror ? (cfg.bow.side === 'right' ? 'left' : 'right') : cfg.bow.side) : null;
    const amp = cfg.bow ? SOLVERS[cfg.bow.amp](ds) : 0;
    const at = {};
    ds.filter(who).forEach(d => { const S = pos(d), E = FORMATIONS[layoutName].slot(d.station, lane, N);
      const vx = E.x - S.x, vy = E.y - S.y, sg = side === 'right' ? 1 : -1;
      // A dancer whose lane slot is where she already stands does not travel — and a dancer who does
      // not travel has no side to bow to. The bow is the NORMAL to her travel, so a zero travel vector
      // leaves that normal undefined. Guarding the division alone (`|| 1`) is not enough and was the
      // bug: an exact zero fell back to no bow, while a residue of 5.7e-14px normalised to a full unit
      // vector pointing wherever the rounding happened to land — a 17.5px sidestep aimed by the 14th
      // decimal place. That is what made Dame Pequeña differ between phases and between couple counts
      // when, geometrically, it is the same figure on the same mini-wheel every time. She stands.
      const u = dirFrom(vx, vy);
      if (!u){ at[d.id] = () => ({ x: S.x, y: S.y }); return; }
      at[d.id] = t => { const te = cfg.ease === 'smooth' ? _smooth(t) : t, k = amp * Math.sin(Math.PI * t);
        return { x: S.x + vx * te + sg * (-u.y) * k, y: S.y + vy * te + sg * u.x * k }; };
    });
    return at;
  },
};

/* A movement may be a SEQUENCE OF PHRASES with different intents in each — a scripted opening, then a
 * travel, say. Each phrase starts from where the last one left the dancers. (MOVEMENT_SPEC §4 listed
 * "a dancer whose couple midpoint moves and then returns within one movement" as the model assumption
 * most likely to need extending; this is that extension, and it is additive.) */
function playPhrases(ds, N, phrases){
  let cur = ds; const frames = [], segBeats = []; let haveBeats = true;
  phrases.forEach(ph => {
    const out = ph(cur);
    const fs = Array.isArray(out) ? out : out.frames;
    const sb = Array.isArray(out) ? null : out.segBeats;
    frames.push(...fs);
    if (sb) segBeats.push(...sb); else { haveBeats = false; fs.forEach(() => segBeats.push(0)); }
    cur = fs[fs.length - 1].map(d => ({ ...d }));
  });
  return { frames, segBeats: haveBeats ? segBeats : null };
}

/* The 4-beat Dile Que No OPENING as a scripted figure: dip out along your own Exhibela line, back, onto
 * the couple's midpoint spoke, pause. Beats 2 and 3 are marked `round`, so they join into ONE curve
 * through the start point rather than meeting at a hard corner there.
 * `io` is +1 normally and −1 afuera, which mirrors the figure inside out.
 * ONE definition, shared by the standalone 4-beat Dile Que No and by the Dile Que No y Dame compounds
 * that open with exactly these four beats — so the two can no longer drift apart. */

/* 4-beat Dile Que No (Exhibela -> Dile Que No position). The opening of a Dile Que No y Dame, danced
 * on its own: beats 1-2 dip out along the Exhibela line and back; beat 3 step onto the couple's
 * midpoint spoke — leader to the OUTER lane (just outside the ring), follower to the INNER lane (just
 * inside) — and pause on beat 4. The leader faces his follower through beats 1-2, turns to face the
 * centre by beat 3 and holds; the follower turns 90° right to the centre on beat 1, holds, then turns
 * to perpendicular-to-the-spoke (clockwise) on beat 3 and holds. Ends in the Dile Que No position —
 * no progression, no phase change. */

/* Mujeres Arriba (Dile Que No position -> Exhibela). The women advance: every follower progresses one
 * partnership CLOCKWISE to the next couple's Exhibela spot, doing ALL the travelling so the spokes and
 * the phase stay put. Each leader — having just danced a 4-beat Dile Que No — retraces it in reverse,
 * from his outer spoke point straight back to his OWN Exhibela spot on the ring, facing the centre the
 * whole way and turning to his RIGHT (clockwise) to meet his new follower as he arrives. Ends in
 * Exhibela: leaders NOT progressed, the pairing shifted by one, no phase change. */

/* Leader's Right Turn — a 4-beat figure danced in place. The follower stays exactly put and does
 * not rotate; the leader holds his spot and turns a full 360° to his right (clockwise), ending
 * facing exactly the way he began. Nothing moves position. Danced after an Enchufla it leaves the
 * couple looking like Exhibela, but in the new Afuera Casino position (an inside-out Casino). */
function leadersRightTurn(ds, N){ return playFigure('leaders_right_turn', ds); }

const svg = document.getElementById('stage');
const NS = 'http://www.w3.org/2000/svg';
let nodes = {};

// The faint guide (rings, spokes, Línea mini-wheels) depends on the formation, couple count and — for
// Línea — the phase (the mini-wheels sit on the current spoke config). It lives in its own layer so it
// can be redrawn when the phase flips (e.g. a grande Dame) without rebuilding the dancer nodes.
let guideLayer = null, lastGuideKey = '';
const guideKey = () => `${layoutName}|${phase}|${N}|${LM_GAP}|${LM_BASE}|${BASE_ANG}`;
function drawGuide(){
  if (!guideLayer) return;
  while (guideLayer.firstChild) guideLayer.removeChild(guideLayer.firstChild);
  FORMATIONS[layoutName].guide(guideLayer);
  lastGuideKey = guideKey();
}
function refreshGuide(){ if (guideKey() !== lastGuideKey) drawGuide(); }   // redraw only when it actually changed
function buildNodes(){
  svg.innerHTML = '';
  nodes = {};

  guideLayer.setAttribute('class', 'guide');

  dancers.forEach(d=>{

    arrow.setAttribute('d',`M 0 -3 L ${hb} -3 L ${hb} -7 L ${ARROW_LEN} 0 L ${hb} 7 L ${hb} 3 L 0 3 Z`);
    arrow.setAttribute('fill', d.role==='L' ? '#ff7a59' : '#3fc6a0');

      const ring = document.createElementNS(NS,'circle');

function resolveRot(cur, target, dir){
  if (cur === undefined) return target;
  if (dir === 'cw')  return cur + ((((target - cur) % 360) + 360) % 360);  // turn right (clockwise)
  if (dir === 'ccw') return cur - ((((cur - target) % 360) + 360) % 360);  // turn left (anti-clockwise)
  return cur + (((((target - cur) % 360) + 540) % 360) - 180);             // shortest way
}
function render(){
  refreshGuide();                                  // keep the formation guide (Línea mini-wheels) in sync with the phase
  dancers.forEach(d=>{
    const p = pos(d);
    const n = nodes[d.id];
    if (!n) return;
    n.g.style.transform = `translate(${p.x}px,${p.y}px)`;
    const target = facingAngle(d);
    if (d.snapTurn){
      n.rot = target;                              // rotate instantly, no tween...
      const prev = n.arrowG.style.transition;
      n.arrowG.style.transition = 'none';
      n.arrowG.style.transform = `rotate(${n.rot}deg)`;
      n.arrowG.getBoundingClientRect();            // ...force it to commit now...
      n.arrowG.style.transition = prev;            // ...then restore whatever was active
    } else {
      n.rot = resolveRot(n.rot, target, d.turn);
      n.arrowG.style.transform = `rotate(${n.rot}deg)`;
    }
  });
  renderTable();
}

/* ------------------------------ actions ------------------------------ */
// Afuera ("inside-out") positions mirror the normal two: 'afuera' (Afuera Casino, looks like Exhibela)
// behaves like Casino; 'afuera_exhibela' (Afuera Exhibela, looks like Casino) behaves like Exhibela.
// virtualPos maps an afuera position to the normal one whose rules it follows (from the POSITIONS table).
const virtualPos = p => POSITIONS[p].virtual;
const isAfuera = p => POSITIONS[p].inverted;
const resolveSets = (mv, from) => {
  if (mv.relabel) return (typeof mv.sets === 'function') ? mv.sets(from) : mv.sets;   // afuera/adentro: use the real from, cross frames
  const v = (typeof mv.sets === 'function') ? mv.sets(virtualPos(from)) : mv.sets;
  if (isAfuera(from) && INVERTED_OF[v]) return INVERTED_OF[v];                          // stay inside-out
  return v;
};
// A movement is valid from p. Relabel moves (Afuera/Adentro) match their raw requires (they cross
// between the normal and afuera frames). While afuera, entry-only and not-yet-afuera moves are
// blocked; everything else maps through virtualPos.
const validFrom = (key, p) => {
  const m = MOVEMENTS[key]; if (!m) return false;
  if (m.needsEven && N % 2) return false;          // Línea Moderna only splits evenly into two rings
  if (m.noAfuera && isAfuera(p)) return false;     // deliberately not offered from Afuera Casino (yet)
  /* A couple-count floor can depend on WHERE the figure is danced. The 4-beat Dile Que No needs six
   * couples in Línea — on a mini wheel its step runs along a spoke pointing at the main centre, and at
   * four couples the inner couples sit close enough that their leaders land on top of each other — and
   * needs no floor at all on the full rueda, where there is room. One movement, one name, two geometries.
   * Resolved the way `sets`, `beats` and `flipsPhase` already are. */
  const floor = (typeof m.minCouples === 'function') ? m.minCouples(p) : m.minCouples;
  if (floor && N < floor) return false;                 // the figure physically doesn't fit on a smaller wheel
  if (m.relabel) return m.requires.includes(p);
  if (isAfuera(p)) return !m.entryOnly && (!m.progresses || m.afueraReady) && m.requires.includes(virtualPos(p));
  return m.requires.includes(p);
};

// Which beat of the measure a movement starts on when it's snapped to the grid.
// Most start on 1; Dame from Casino starts on 7 and Dame Dos from Casino on 5 (so both end on 8).
// Which beat of the measure a movement snaps to when it's the first of a call. A progressing Dame-type
// figure that closes into a Dile Que No should END on beat 8 (so the Dile lands on beat 1), i.e. start
// on beat 9 − its beat count (Dame from Casino = 2 beats → 7; a 4-beat Dame/Dame Grande/Pequeña → 5).
// Everything else starts on 1.
const DAME_KEYS = new Set(['dame', 'dame_dos', 'dame_grande', 'dame_peq', 'dame_pequena', 'dame_linea', 'dame_ene']);
function startBeatOf(key, from){
  if (DAME_KEYS.has(key)){ const mv = MOVEMENTS[key];
    const beats = typeof mv.beats === 'function' ? mv.beats(from) : (mv.beats || 4);
    return ((9 - beats - 1) % 8 + 8) % 8 + 1;
  }
  return 1;
}
function showBeat(b0){
  const b = ((Math.floor(b0) % 8) + 8) % 8;                       // 0-indexed beat of the measure
  const big = document.getElementById('beatbig'); if (big) big.textContent = b + 1;
  const pips = document.getElementById('beatpips');
  if (pips) for (let i = 0; i < pips.children.length; i++) pips.children[i].classList.toggle('on', i === b);
}

// Inside-out (afuera) version of an IN-COUPLE figure: run the normal generator on a per-couple
// 180° point-reflection of the wheel (about each couple's midpoint), then reflect the frames back.
// A 180° rotation preserves handedness, so every spin keeps its direction while inside<->outside
// and the Casino<->Exhibela look both flip, and the couple faces map by +180°. (In-couple only —
// progressing figures like Dame handle afuera in their own generators.)
function afueraFrames(mv, dsReal, N, from){
  const P = {}, ctr = {};
  dsReal.forEach(d => P[d.id] = pos(d));
  dsReal.forEach(d => { const pr = dsReal.find(o => o.station === d.station && o.role !== d.role);
    ctr[d.id] = { x: (P[d.id].x + P[pr.id].x) / 2, y: (P[d.id].y + P[pr.id].y) / 2 }; });
  const refl = (id, p) => ({ x: 2 * ctr[id].x - p.x, y: 2 * ctr[id].y - p.y });
  const swapLane = l => l === 'cw' ? 'ccw' : l === 'ccw' ? 'cw' : l;
  const virt = dsReal.map(d => ({ ...d, xy: refl(d.id, P[d.id]), lane: swapLane(d.lane), face: (typeof d.face === 'number') ? d.face + 180 : d.face }));
  const saved = dancers; dancers = virt;
  let out; try { out = movementFrames(mv, virt, N, virtualPos(from)); } finally { dancers = saved; }
  const vframes = Array.isArray(out) ? out : out.frames;
  const segBeats = Array.isArray(out) ? null : out.segBeats;
  const frames = vframes.map(fr => fr.map(d => {
    const o = { ...d, xy: refl(d.id, d.xy || P[d.id]), lane: swapLane(d.lane) };
    if (typeof d.face === 'number') o.face = d.face + 180;
    return o;
  }));
  return segBeats ? { frames, segBeats } : frames;
}

/* ------------------------------------------------------------------ *
 *  Línea Moderna — GRANDE composition. A grande movement runs an ordinary
 *  circle movement on the whole outer ring (as a normal m-couple rueda) and
 *  on the whole inner ring (as an afuera m-couple rueda) at the same time,
 *  through the wheel-context seam, then merges the two rings' frames. Because
 *  both rings dance the same movement, the frame counts and beat timing match
 *  1:1. Endpoints land on the Línea grid (the ring context's circle.slot
 *  reproduces linea.slot exactly), so nothing drifts.
 * ------------------------------------------------------------------ */
/* Grande merges whose re-plan loop ran out of passes without reaching a fixed point. Empty is the
 * contract — see the note at the loop. */
const REPLAN_UNSETTLED = [];
// Each Línea resting/transient state maps to the circle sub-position of the two rings.
const LINEA_SUB = {
  linea:      { outer: 'casino',   inner: 'afuera' },           // rest
  linea_ex:   { outer: 'exhibela', inner: 'afuera_exhibela' },  // both rings exhibela-like
  /* MEASURED, NOT ASSUMED: the grande and pequeña Línea Moderna Dile Que No positions are the SAME
   * PLACE. Every dancer's radius agrees to 0.00px at 4, 6 and 8 couples on both rings, because
   * `mcR ± mid2` is exactly `R_MID` of the ring — the mini wheel is built so its couples sit on the
   * rings. So there is one `linea_dile`, reached either way, and a figure danced from it may be either
   * sense. Same argument, same measurement, as the merge of linea_ex and linea_pex before it. */
  linea_dile: { outer: 'dile',     inner: 'afuera_dile' },
};

/* WHICH WHEEL A FIGURE IS DANCED ON — the reference for counting a progression.
 * A movement's `progresses` is a number of COUPLES, and the wheel those couples belong to is not always
 * the whole rueda: a grande figure runs on each RING (m couples), a pequeña one on each mini 2-couple
 * wheel. That is why "a Dame Dos progresses two couples" lands the leader back where he started in a
 * pequeña — two couples IS the whole wheel there. Both partitions already existed, written inline in
 * terms of station and in different places; they are named once here so the engine and the suite cannot
 * hold different opinions about which couples a figure was danced among.
 *   kind: 'grande' | 'pequena' | null (the plain circle)
 *   size — couples per reference wheel;  of(station) — which wheel;  local(station) — index within it */
function refWheels(kind, N){
  const m = LM.m;
  if (kind === 'grande')  return { size: m, of: st => (st < m ? 0 : 1), local: st => (st < m ? st : st - m) };
  // A mini-wheel pairs the inner ring's station j with the outer ring's station m+j — outer is its
  // station 0 and inner its station 1, exactly as pequenaFrames builds it.
  if (kind === 'pequena') return { size: 2, of: st => st % m,          local: st => (st < m ? 1 : 0) };
  return { size: N, of: () => 0, local: st => st };
}
// A movement's composition kind, which is what decides its reference wheel.
const composeKind = mv => (mv && mv.play && mv.play.compose) || null;
/* Whether a movement flips the spoke config can depend on where it is called FROM, now that one movement
 * can be danced from several positions with different addresses. A Dame from Casino or Exhibela moves its
 * leader an ODD number of half-spacings and flips; the same Dame from the Dile Que No position moves him
 * an even number and does not. Resolved the way `sets` and `beats` already are. */
/* The pass sides a movement declares, resolved through however its play is built. The suite has to be
 * able to ask this: checking a movement against the GLOBAL convention condemns every figure that
 * legitimately names an exception, which is the whole point of letting it name one. */
function declaredPasses(mv, from, depth){
  let p = mv && mv.play; if (!p || (depth || 0) > 3) return null;
  if (p.byFrom) p = p.byFrom[virtualPos(from)] || p.byFrom.default;
  if (!p) return null;
  /* A COMPOSITION MUST TRANSLATE THE POSITION, NOT JUST THE FIGURE. `grandeFrames` runs the circle figure
   * from the ring's sub-position and `pequenaFrames` from the mini-wheel's; recursing with the LÍNEA name
   * asked the circle figure about a position it has never heard of, so `byFrom` fell through to its
   * default branch and reported the wrong figure's pass sides.
   *
   * Measured: a Dame Grande from the Línea Moderna Dile Que No position reported `partner0: 'left'` — the
   * Casino Dame's side — where the Dile Que No Dame declares `'right'`. The planner was told to hold the
   * leader on the wrong side of the partner he starts beside, spent the whole figure failing to, and left
   * a follower walking 10.42x her straight line. Sam, who had told me the side twice: "I suspect that
   * this is probably caused by the passing side being wrong for this movement." It was. */
  if (p.compose && MOVEMENTS[p.of]){
    const sub = p.compose === 'grande' ? (LINEA_SUB[from] || {}).outer : LINEA_SUB_PEQ[from];
    return declaredPasses(MOVEMENTS[p.of], sub || from, (depth || 0) + 1);
  }
  const def = typeof p.travel === 'string' ? TRAVELS[p.travel] : null;
  // A play may override the definition's sides through `opts` — `resolveTravel` merges `o` over the
  // definition, so this has to read the same way round or the suite judges sides the figure replaced.
  const over = p.opts && p.opts.passes;
  return over || (def ? def.passes || null : null);
}
/* WHICH ROLES ARE SCRIPTED in a figure, resolved through however its play is built — the same walk as
 * `declaredPasses`. A scripted dancer's path is choreography stated in her own frame: she walks exactly
 * what she was told, so measuring how far that is against the straight line between her endpoints says
 * nothing about the pathing. Sam: "scripted routes like the follower's 3/4 circle shouldn't be included
 * in the path-vs-straight ratio, only moves that are non-scripted pathings like the Dames." */
function scriptedRoles(mv, from, depth){
  let p = mv && mv.play; const out = new Set();
  if (!p || (depth || 0) > 3) return out;

/* ------------------------------------------------------------------ *
 *  Línea Moderna — PEQUEÑA composition. Instead of two big rings, the wheel

// Resolve a movement's frames + beat timing and animate it (leadBeats = a lead-in hold on the spot).
/* A movement's frames. Where the movement carries a declarative `play` descriptor — a named figure or a
 * named travel from the registries — the engine builds them from data; otherwise it calls the movement's
 * own generator. This is the seam a user-authored movement arrives through: it will have a `play`
 * descriptor and nothing else, so anything expressible here is expressible by a user.
 *   play := { figure, params } | { travel, mirror, opts }
 * `mirror: true` mirrors the definition inside out when danced from an afuera position. */

function movementFrames(mv, ds, N, from){

  /* ONE MOVEMENT, DIFFERENT DANCING DEPENDING ON WHERE IT IS CALLED FROM. A Dame from Casino, from
   * Exhibela and from the Dile Que No position are the same call and the same figure to a dancer; they
   * are different geometry to the engine. `sets` and `beats` have always been allowed to depend on
   * `from` — this lets `play` do the same, rather than minting a second movement per position. */
  if (p.byFrom){ p = p.byFrom[virtualPos(from)] || p.byFrom.default; if (!p) return mv.frames(ds, N, from); }
  // A movement may be a SEQUENCE OF PHRASES with different intents in each — a scripted opening, then a
  // travel. Each phrase starts from where the last left the dancers.
  if (p.phrases){
    const start = {}; ds.forEach(d => start[d.id] = pos(d));
    return playPhrases(ds, N, p.phrases.map(ph =>
      cur => movementFrames({ play: Object.assign({ startOf: start }, ph), flipsPhase: mv.flipsPhase }, cur, N, from)));
  }
  if (p.figure) return playFigure(p.figure, ds, p.params, p.mirror ? isAfuera(from) : false);
  if (p.formation) return FORMATION_CHANGES[p.formation](ds, N, p.turn);
  // A 0-beat relabel: nobody moves, the position's name changes. One frame, everyone as they are.
  if (p.hold) return [ds.map(d => ({ ...d }))];
  // Composed onto Línea Moderna's sub-wheels: the same circle figure danced by the whole two-ring wheel
  // (grande) or by each mini 2-couple wheel (pequeña).
  if (p.compose) return (p.compose === 'grande' ? grandeFrames : pequenaFrames)(p.of, from);

  const def = TRAVELS[p.travel];

  // path, and a facing rule that may branch on the position the movement was called from.
  const roleOf = {}; ds.forEach(d => roleOf[d.id] = d.role);
  const paths = {};
  /* A SCRIPT CLAUSE IS SELECTED THE WAY A TRAVEL CLAUSE IS. Its key was a role and is now a selector, so
   * the scripted half of a figure can name `'inner,F'` for the same reason the travelling half can.
   *
   * The raw declared lane; each SCRIPT_KIND mirrors it itself if its geometry needs it (`to_lane` and
   * `three_quarter_circle` both do). Mirroring here as well would double it back. */
  const gctx = groupContext(ds, N, flipsPhaseOf(mv, from) ? phase ^ 1 : phase);

     * is danced on — `three_quarter_circle` reads `CX,CY` and `R_MID()` directly — which is exactly right
     * and exactly why the composition seam exists. A cross-wheel figure is the first one that needs the
     * scripted half on the mini-wheels while the travelling half works in the formation, so a clause may
     * say `about: 'ownWheel'` and get built inside each mini-wheel's context, through the same view the

     * it is built, so a path built in one context is safe to evaluate in another. */
    if (cfg.about === 'ownWheel' && FORMATIONS[layoutName].miniCenter){
      for (let k = 0; k < N / 2; k++){
        const v = miniWheelView(ds, k);
        Object.assign(paths, runOnWheel(v.ctx, v.sub, () => SCRIPT_KINDS[cfg.kind](v.sub, 2, cfg, mirror, who)));
      }
    } else Object.assign(paths, SCRIPT_KINDS[cfg.kind](ds, N, cfg, mirror, who));

    // `n` so a travel's group selectors resolve against the wheel this movement is actually danced on —
    // a grande ring is an m-couple rueda, not the whole formation, and `GROUPS` reads places.
    n: N,
    phaseBefore: flipsPhaseOf(mv, from) ? phase ^ 1 : phase, mirror,

function playMovement(mv, from, onDone, leadBeats = 0){
  if (mv.relabel || mv.beats === 0){ snapRestLanes(); render(); renderTable(); updateUI(); if (onDone) onDone(); return; }
  const out = (isAfuera(from) && !mv.progresses && !mv.relabel) ? afueraFrames(mv, dancers, N, from) : movementFrames(mv, dancers, N, from);
  const fr = Array.isArray(out) ? out : out.frames;
  snapRestLanes(fr[fr.length - 1]);
  const segBeats = Array.isArray(out) ? null : out.segBeats;
  const beats = typeof mv.beats === 'function' ? mv.beats(from) : (mv.beats || 4);
  playFrames(fr, mv.anim, onDone, { beats, segBeats, leadBeats });
}

// Run one movement (a physical figure), then continue the engine at the next decision point.
function runMovement(key, fromQueue, leadBeats){
  if (fromQueue && queue[0] === key){                // consume this movement — and adopt its owning call
    queue.shift();
    const c = queueCalls.shift();
    if (c !== undefined) currentCall = c;             // a queued default (empty queueCalls) keeps the current call
  }
  const mv = MOVEMENTS[key], from = posState;
  history.push(dancers.map(d => ({ ...d }))); histPos.push(from);
  histQueue.push(queue.slice()); histQueueCalls.push(queueCalls.slice()); histPhase.push(phase);
  histLayout.push({ layoutName, LM_BASE, BASE_ANG });        // a formation-changing movement must be undoable too
  stepCount++;
  currentMoveLabel = mv.label;                     // top-left "now playing"
  /* NO LOG LINE HERE. This used to write one per MOVEMENT, so a single "Dame" arrived in the log as
   * "Dile Que No (default)" then "Dame", and a caller reading it back could not tell what had actually
   * been shouted from what the rules of rueda had supplied on its behalf. Sam: "just list the actual
   * calls, not their individual movements, and not anything that is done implicitly."
   *
   * The log is written where calls are ISSUED (issueCall) and nowhere else. The movement currently
   * running is not lost — it is the top-left now-playing line, which is where a dancer looks for it. */
  posState = resolveSets(mv, from);
  // Lock in resting positions BEFORE flipping the config: a phase flip changes what pos() returns for
  // any dancer without a live xy (e.g. the first move right after a reset), which would otherwise move
  // the animation's start point onto the new grid and cause a visible lurch.
  if (flipsPhaseOf(mv, from)){ dancers.forEach(d => { if (!d.xy) d.xy = pos(d); }); phase ^= 1; }
  engineActive = true;
  playMovement(mv, from, step, leadBeats || 0);
}

// What the dancers would do next on their own: a queued figure, the Exhibela default, or rest.
function nextMovement(){
  while (queue.length && !validFrom(queue[0], posState)){ queue.shift(); queueCalls.shift(); }
  if (queue.length) return queue[0];
  return positionDefault(posState);          // a transient Exhibela closes with a Dile Que No; rest otherwise
}
// Decision point reached after a movement. Calls only take effect at interruption points
// (right before a Dame or before a Dile Que No); other junctures just run through.
function step(){
  if (animating) return;
  const nk = nextMovement();

/* ------------------------------------------------------------------ *
 *  Sub-keyframe interpolation — how the renderer gets BETWEEN keyframes.
 *
 *  Keyframes are samples of a curved path, so joining them with straight lines renders a
 *  CHORD of the true arc: the drawn path cuts every corner, dipping inside the intended
 *  line mid-segment and snapping back at each keyframe. Measured before this existed, that
 *  cost up to 2.7px on the worst figure and showed up as a visible pulse — most obviously on
 *  the Línea entries and exits, where a rigid couple rotating about its own midpoint appeared
 *  to squeeze together and spring apart 15 times on the way across. Nothing was wrong with
 *  the movement: every keyframe had the couple at exactly 64.0px. It was the drawing.
 *
 *  So a segment is drawn as a blend of the two CIRCLES through its neighbouring keyframes —
 *  circle(A,B,C) and circle(B,C,D) for the segment B→C — weighted from the first to the
 *  second across the segment. Three properties earn it its place:
 *
 *   - **Circles are exact.** If the four keyframes lie on one circle both arcs ARE that
 *     circle, so the blend is too. Rigid rotation about a midpoint is circular motion, which
 *     is why this fixes the couple pulse completely rather than merely reducing it.
 *   - **It is C1 across joins for free.** Segment B→C starts on circle(A,B,C); the previous
 *     segment A→B ends on circle(A,B,C) — literally the same circle — so the tangents agree
 *     with no continuity condition to impose.
 *   - **It cannot overshoot far.** The drawn point stays between two arcs that share the
 *     segment's endpoints, so the departure from the straight line is bounded by their
 *     sagittae; unlike a spline it has no free tension to bulge past the keyframes.
 *
 *  CORNERS ARE THE ENGINE'S BUSINESS, NOT THE RENDERER'S. Where a figure genuinely reverses
 *  — the out-and-back of a Dile or an Exhibela — there is no arc to find and rounding it off
 *  would invent choreography. The engine already rounds the corners it wants rounded (the
 *  4-beat opening's beat-2/3 arc is built that way on purpose), so a reversal here is meant.
 *  Measured across every movement, the per-keyframe direction change is sharply bimodal:
 *  31,801 samples below 30°, nothing at all between 120° and 170°, and 396 samples at
 *  170–190° (the reversals). CORNER_DEG sits in that empty band, so the split is read off the
 *  data rather than tuned — and a corner falls back to the straight line it deserves. */
const CORNER_DEG = 150;          // direction change above which a keyframe is a genuine corner
const ARC_MIN_SAG = 0.01;        // px — below this the arc and the chord are the same line
function _circleArc(A, B, C, u){
  // The point at parameter u along B→C on the circle through A, B, C. Returns null when there
  // is no usable circle: a corner, a stationary leg, or three points near enough to a straight
  // line that the chord already IS the arc.
  if (!A || !C || !B) return null;

/* Draw the path `pts` at parameter `u` within segment `sg` (from pts[sg] to pts[sg+1]).

const SREF = 0.12, RREF = 0.55;                      // reference px and degrees per unit of cost

  // A lead-in hold on the spot (snapping the movement to its start beat) precedes the movement.
  const leadBeats = timing.leadBeats || 0, leadMs = leadBeats * msPerBeat;
  const totalBeats = leadBeats + (timing.segBeats ? timing.segBeats.reduce((a, b) => a + b, 0) : (timing.beats || 4));
  const beatStart = beatCursor;
  const dur = Math.max(leadMs + cum[F], 1);
  let start = null;
  const myGen = ++animGen;                                // this run's token; a newer run (or Reset) invalidates it
  const tick = now => {
    if (myGen !== animGen) return;                        // aborted (e.g. Reset pressed mid-move) — stop cleanly
    if (start === null) start = now;
    const el = Math.min(dur, now - start);
    showBeat(beatStart + el / msPerBeat);
    if (el < leadMs){                                    // holding on the spot before the movement starts
      ids.forEach(id => { const n = nodes[id]; if (!n) return; const a = P[id][0];
        n.g.style.transform = `translate(${a.x}px,${a.y}px)`; n.rot = ROT[id][0]; n.arrowG.style.transform = `rotate(${n.rot}deg)`; });
    } else {
      const e2 = el - leadMs;
      let sg = 0; while (sg < F - 1 && cum[sg + 1] <= e2) sg++;
      const span = cum[sg + 1] - cum[sg], lt = span > 0 ? (e2 - cum[sg]) / span : 1;
      ids.forEach(id => {
        const n = nodes[id]; if (!n) return;
        const p = samplePath(P[id], sg, lt);
        n.g.style.transform = `translate(${p.x}px,${p.y}px)`;
        const ra = ROT[id][sg], rb = ROT[id][sg + 1];
        n.rot = SNAP[id][sg + 1] ? rb : ra + (rb - ra) * lt;   // snapped turns jump at segment start
        n.arrowG.style.transform = `rotate(${n.rot}deg)`;
      });
    }
    if (el < dur) requestAnimationFrame(tick);
    else {
      dancers = finalState;
      ids.forEach(id => { if (nodes[id]) nodes[id].rot = ROT[id][F]; });
      Object.values(nodes).forEach(n => { n.g.style.transition = G_TRANS; n.arrowG.style.transition = ARROW_TRANS; });
      refreshGuide();                                     // phase may have flipped — move the Línea mini-wheels to the new config
      beatCursor = Math.round(beatStart + totalBeats); showBeat(beatCursor); animating = false; renderTable();
      if (onDone) onDone(); else updateUI();
    }
  };
  requestAnimationFrame(tick);
}
function undo(){
  if (animating || !history.length) return;
  dancers = history.pop();
  if (histPos.length) posState = histPos.pop();
  if (histPhase.length) phase = histPhase.pop();
  if (histLayout.length){ const L = histLayout.pop();      // restore the formation (and its orientation)
    if (L.layoutName !== layoutName || L.LM_BASE !== LM_BASE || L.BASE_ANG !== BASE_ANG){
      layoutName = L.layoutName; LM_BASE = L.LM_BASE; BASE_ANG = L.BASE_ANG; computeWheel(N); buildNodes(); } }
  if (histQueue.length) histQueue.pop();
  if (histQueueCalls.length) histQueueCalls.pop();
  queue = []; queueCalls = []; engineActive = false; awaiting = false; pendingDefault = null; pendingInterrupt = null; pendingCall = null; rawMovement = false;   // cancel any running sequence
  currentCall = null; currentMoveLabel = null;
  stepCount = Math.max(0, stepCount-1);
  logLine('Undo', null, true);
  render(); updateUI();
}
function reset(){
  animGen++; animating = false;                 // abort any in-flight move so dancers stop before resetting
  LM_BASE = -90; BASE_ANG = -90;                // rest orientation (the entry/exit movements re-aim these)
  computeWheel(N);
  dancers = baseState(N);
  history = []; histPos.length = 0; histQueue.length = 0; histQueueCalls.length = 0; histPhase.length = 0; histLayout.length = 0; stepCount = 0; logCount = 0; posState = layoutName === 'linea' ? 'linea' : 'casino'; phase = 0;
  queue = []; queueCalls = []; engineActive = false; awaiting = false; pendingDefault = null; pendingInterrupt = null; pendingCall = null; rawMovement = false;
  currentCall = null; currentMoveLabel = null;
  beatCursor = 0; justIssued = false; showBeat(0);
  document.getElementById('log').innerHTML = '';
  buildNodes(); render(); updateUI();
}
function logLine(move, note, undo=false){
  const log = document.getElementById('log');
  const div = document.createElement('div');
  const n = undo ? '' : `<span class="step">${++logCount}.</span> `;
  div.innerHTML = `${n}<span class="move">${move}</span>` + (note?` <span class="note">(${note})</span>`:'');
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

/* Panel toggles: show/hide the whole section, and whether unavailable entries grey out (default) or
 * disappear. Hiding is applied per BUTTON and per GROUP, so an empty group takes its heading with it. */
let panelTab = 'calls';                                  // which list the one panel is showing
function applyPanelPrefs(){
  const hiding = !!(document.getElementById('hideUnavail') || {}).checked;
  const showing = { calls: panelTab === 'calls', moves: panelTab === 'moves' };
  [['tabCalls', 'calls'], ['tabMoves', 'moves']].forEach(([id, which]) => {
    const t = document.getElementById(id); if (!t) return;
    t.classList.toggle('active', showing[which]);
    t.setAttribute('aria-selected', showing[which] ? 'true' : 'false');
  });
  const hint = document.getElementById('moveHint'); if (hint) hint.hidden = !showing.moves;
  [['callButtons', callBtns, showing.calls], ['moveButtons', moveBtns, showing.moves]].forEach(([hostId, btns, on]) => {
    const host = document.getElementById(hostId); if (!host) return;
    host.hidden = !on;
    // Hiding applies per BUTTON and per GROUP, so an empty group takes its heading with it.
    Object.values(btns || {}).forEach(b => { b.style.display = (hiding && b.disabled) ? 'none' : ''; });
    host.querySelectorAll('.grp').forEach(g => {
      const any = [...g.querySelectorAll('button')].some(b => b.style.display !== 'none');
      g.classList.toggle('empty', !any);
    });
  });
}
function setPanelTab(which){ panelTab = which; applyPanelPrefs(); }

/* ------------------------------ wiring ------------------------------ */
/* ------------------------------------------------------------------ *
 *  Grouping — DERIVED, never hand-labelled. A movement's group falls out of what it already declares
 *  (does it change formation, does it progress, does it flip the phase), and a call's falls out of the
 *  movements it expands to. So a new movement lands in the right group without anyone maintaining a
 *  list, and the two panels can never disagree about what something is.
 * ------------------------------------------------------------------ */
/* ONE PROGRESSIONS GROUP, not two. It used to split "Progressions that flip the phase" from
 * "Progressions on the same phase" — a real distinction in the arithmetic, and a false one on a button,
 * because whether a figure flips the phase can depend on WHERE IT IS DANCED FROM. Sam: "Dame is listed in
 * the movements that flip the phase section, however if it's called from Dile Que No position, it doesn't
 * flip the phase."
 *
 * Exactly so: `dame.flipsPhase` is `virtualPos(from) !== 'dile'`. A panel heading has no from-position, so
 * it was filing a movement under one of two answers to a question that has several. The distinction is
 * still there where it belongs — in `flipsPhase`, which the engine asks per call — and off the label,
 * which cannot state it honestly. */
const MOVE_GROUPS = [
  ['formation',  'Formation & frame'],
  ['progressive','Progressions'],
  ['standard',   'Standard'],
];
const CALL_GROUPS = [
  ['formation',  'Formation & frame'],
  ['progressive','Progressions'],
  ['interrupt',  'Interruptions'],
  ['standard',   'Standard'],
];
function moveGroup(key){
  const m = MOVEMENTS[key]; if (!m) return 'standard';
  // A formation change replaces the slot set; a relabel (Afuera/Adentro) turns the whole wheel
  // inside out. Neither moves anyone to a new partner, but both change how everything after is danced.
  if ((m.play && m.play.formation) || m.relabel) return 'formation';
  // Progressing is a property of the figure; flipping the phase is a property of the figure AND the
  // position it is danced from, so it cannot label a button. Both panels now name the same group.
  return m.progresses ? 'progressive' : 'standard';
}
function callGroup(key){
  const c = CALLS[key]; if (!c) return 'standard';
  if (c.modifier) return 'interrupt';
  const groups = (c.seq || []).map(moveGroup);
  if (groups.includes('formation')) return 'formation';
  if (groups.includes('progressive')) return 'progressive';
  return 'standard';
}

/* Where the wheel will be RESTING once everything currently queued — and the default that follows it —
 * has run. This is what decides which calls may be lined up behind the one playing: a call can follow
 * if the wheel will be somewhere it can start from. */
/* WHAT THE DANCERS DO AT p WITH NOTHING CALLED. A transient Exhibela — in the circle, afuera, or Línea
 * Moderna — closes with a Dile Que No; everywhere else they rest. This was written out identically in
 * four places (nextMovement, projectedEndPos, interruptionPointAhead, and the step-mode default), which
 * is the same shape of duplication that let the interruption points drift out of step with Línea. One
 * copy, so a formation that gains a transient Exhibela gains its default everywhere at once. */
function positionDefault(p){
  if ((POSITIONS[p] || {}).variant === 'exhibela') return 'dile';
  if (p === 'linea_ex') return 'dile';
  return null;
}
function projectedEndPos(){
  let p = posState; const q = queue.slice();
  for (let guard = 0; guard < 40; guard++){
    while (q.length && !validFrom(q[0], p)) q.shift();
    const k = q.length ? q.shift() : positionDefault(p);
    if (!k || !MOVEMENTS[k]) break;
    p = resolveSets(MOVEMENTS[k], p) || p;
  }
  return p;
}
/* Is there still a juncture in the current sequence where an interruption could land? */
function interruptionPointAhead(){
  let p = posState; const q = queue.slice();
  for (let guard = 0; guard < 40; guard++){
    while (q.length && !validFrom(q[0], p)) q.shift();
    const k = q.length ? q[0] : positionDefault(p);
    if (!k) break;
    if (INTERRUPTIBLE.has(k)) return true;
    if (q.length) q.shift(); else return false;
    if (!MOVEMENTS[k]) break;
    p = resolveSets(MOVEMENTS[k], p) || p;
  }
  return false;
}
/* WHERE A MUJERES ARRIBA COULD LAND, or null. Sam's rule: it may be called "when a Dile Que No movement
 * is next in the queue of movements, and there's no other movements queued after it. It acts as an
 * interruption move, interrupting just before the Dile Que No movement and replacing it."
 *
 * Both halves matter. A Dame reached first means the next juncture is a Dame, not a Dile Que No, and the
 * Mujeres Arriba has nothing to replace. Something queued BEHIND the Dile Que No means the caller has
 * already said what happens next, and swallowing their Dile Que No would leave that follow-on starting
 * from a position it never asked for. Returns the position the Dile Que No would have been danced from,
 * because that is what decides which form of the figure fits there. */
function dileInterruptAt(){
  let p = posState; const q = queue.slice();
  for (let guard = 0; guard < 40; guard++){
    while (q.length && !validFrom(q[0], p)) q.shift();
    if (!q.length) return positionDefault(p) ? p : null;   // the implicit close — nothing behind it
    const k = q[0];
    if (k === positionDefault(p)) return q.length === 1 ? p : null;   // explicit, and must be last
    if (INTERRUPTIBLE.has(k)) return null;                            // a Dame gets there first
    q.shift();
    if (!MOVEMENTS[k]) return null;
    p = resolveSets(MOVEMENTS[k], p) || p;
  }
  return null;
}
/* WHAT A CALL BECOMES WHEN IT TAKES A PENDING DILE QUE NO'S PLACE. Sam: "Dame Calls ... which are called
 * when there is a Dile Que No at the end of the queue of movements ready to play, will interrupt that
 * Dile Que No, not by directly replacing it with the called dame movement, but by replacing it with a
 * Dile Que No (4) and then appending the correct Dame."
 *
 * So the Dile Que No is not SKIPPED, it is CUT SHORT to its own 4-beat opening — and the call is then
 * danced from the Dile Que No position that opening lands in. A call already written to open that way
 * (Mujeres Arriba) needs no prefix; it is the same sequence either way. */
const interruptSeqOf = c => (c.seq && c.seq[0] === 'dile4') ? c.seq.slice() : ['dile4'].concat(c.seq || []);
/* WHICH CALLS MAY DO THIS IS DERIVED, NOT LISTED. It used to be `callKey === 'dame' || callKey ===
 * 'dame_dos'` — two circle keys — so Dame Grande and Dame Pequeña, which Línea mints under derived names,
 * fell straight past it and queued normally. Sam found the consequence: "when I called Dame Grande in
 * Linea Moderna as an interrupt on an active call which ended in a Dile Que No, it skipped the Dile Que
 * No entirely and went straight for a Dame Grande from Exhibela position." Same failure as the
 * interruption points before it, and the same fix.
 *
 * The question a hand-list was standing in for is simply: cut the Dile Que No short, and can this call be
 * danced from where that leaves the wheel? A Dame can, because a Dame is defined from the Dile Que No
 * position. An Enchufla cannot, and is not offered. Nothing has to remember which is which. */
function canInterruptDile(c, at){
  if (!c || !c.seq || !c.seq.length || c.modifier) return false;
  if (c.minCouples && N < c.minCouples) return false;
  return callDanceableFrom({ seq: interruptSeqOf(c) }, at);
}
// Offerable mid-sequence if such a juncture exists AND the call's figures fit there.
function interruptLandsFrom(c){
  const at = dileInterruptAt();
  return !!at && canInterruptDile(c, at);
}

function buildButtons(){
  // Both panels render the same way: one block per group, each a fixed grid of equal cells.
  const build = (hostId, groups, entries, groupOf, labelOf, onClick) => {
    const host = document.getElementById(hostId); host.innerHTML = '';
    const btns = {}, blocks = {};
    groups.forEach(([g, title]) => {
      const wrap = document.createElement('div'); wrap.className = 'grp'; wrap.dataset.group = g;
      const h = document.createElement('div'); h.className = 'grp-title'; h.textContent = title;
      const grid = document.createElement('div'); grid.className = 'btngrid';
      wrap.appendChild(h); wrap.appendChild(grid); host.appendChild(wrap);
      blocks[g] = { wrap, grid };
    });
    entries.forEach(key => {
      const b = document.createElement('button');
      b.className = 'call'; b.textContent = labelOf(key); b.title = labelOf(key);
      b.onclick = () => onClick(key);
      (blocks[groupOf(key)] || blocks.standard).grid.appendChild(b);
      btns[key] = b;
    });
    return btns;
  };
  callBtns = build('callButtons', CALL_GROUPS, Object.keys(CALLS), callGroup, k => CALLS[k].label, issueCall);
  moveBtns = build('moveButtons', MOVE_GROUPS, Object.keys(MOVEMENTS), moveGroup, k => MOVEMENTS[k].label, doMovement);
  const pips = document.getElementById('beatpips'); pips.innerHTML = '';
  for (let i = 0; i < 8; i++) pips.appendChild(document.createElement('span'));
}

// Free-running metronome: the beat keeps advancing in real time whenever a movement isn't
// driving it. dt is capped so a backgrounded tab doesn't jump the beat.
let metroLast = null;
function metronome(now){
  if (beatRunning && !animating){
    if (metroLast !== null){ const dt = now - metroLast; if (dt > 0 && dt < 500){ beatCursor += dt / (BASE_MS_PER_BEAT / speedMul); showBeat(beatCursor); } }
    metroLast = now;
  } else metroLast = null;
  requestAnimationFrame(metronome);
}
function toggleBeat(){
  beatRunning = !beatRunning;
  if (beatRunning){ beatCursor = 0; showBeat(0); }        // (re)start the count on beat 1
  document.getElementById('beatToggle').textContent = beatRunning ? '⏸ Stop beat' : '▶ Start beat';
}

document.getElementById('couples').onchange = e=>{ N = +e.target.value; if (layoutName === 'linea' && N % 2) N++; reset(); };
document.getElementById('layout').onchange = e=>{ layoutName = e.target.value; if (layoutName === 'linea' && N % 2) N++; reset(); };   // reset fully into the chosen formation
document.getElementById('reset').onclick = reset;
document.getElementById('undo').onclick = undo;
document.getElementById('beatToggle').onclick = toggleBeat;
document.getElementById('speed').oninput = e => {
  const p = +e.target.value;                         // 0..1, 0.5 = current speed
  speedMul = p < 0.5 ? 0.2 + 1.6 * p : 1 + 2 * (p - 0.5);   // 0.2× … 1× … 2×
  document.getElementById('speedval').textContent = speedMul.toFixed(2) + '×';
};
document.getElementById('modeLive').onclick = () => setMode('live');
document.getElementById('modeStep').onclick = () => setMode('step');
document.getElementById('silenceBtn').onclick = takeDefault;

{ const h = document.getElementById('hideUnavail');
  if (h) h.addEventListener('change', applyPanelPrefs);
  const tc = document.getElementById('tabCalls'), tm = document.getElementById('tabMoves');
  if (tc) tc.onclick = () => setPanelTab('calls');
  if (tm) tm.onclick = () => setPanelTab('moves'); }
buildButtons();
reset();
requestAnimationFrame(metronome);
</script>
